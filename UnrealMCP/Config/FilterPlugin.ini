[FilterPlugin]
; Additional non-source files packaged WITH the plugin by BuildPlugin -Rocket and a
; Fab source submission. Paths are relative to the plugin root (UnrealMCP/) and may
; use the "...", "*", and "?" wildcards. Source/, Config/, Resources/, and *.uplugin
; are included by UAT automatically; this section adds payloads UAT would otherwise
; drop. (docs/ARCHITECTURE.md §6 BUNDLE model, issue #139.)
;
; Fab strips Binaries/, Intermediate/, Saved/, and .vs/ from a submitted SOURCE plugin
; and recompiles it per engine version — so the prebuilt sidecar must NOT live only
; under Binaries/. It lives under the Fab-surviving Sidecar/<rid>/ folders included
; below; UnrealMcpRuntime.Build.cs stages it from there into
; Binaries/ThirdParty/UnrealMcpBridge/<rid>/ at Epic's compile time.

; Fab-surviving sidecar bundle (the prebuilt unreal-mcp-bridge, per RID). The
; ~73-80 MB self-contained binaries are staged into Sidecar/<rid>/ before packaging
; (release.yml signs+stages them; Epic's recompile stages from the submitted source).
; The whole tree ships so the resolver + RuntimeDependencies find the payload after
; Fab strips Binaries/. (A dev source checkout ships only the .gitkeep placeholders +
; README — no payload — which is harmless: the resolver falls back to
; UNREAL_MCP_BRIDGE_PATH for dev, per §6.3.)
/Sidecar/...

; Third-party license attribution for the bundled sidecar (issue #143). UAT does NOT
; auto-include a loose root .txt, so it is declared here to ship in the BuildPlugin
; -Rocket package and the Fab source submission (Fab review expects visible license
; attribution for the redistributed third-party binaries under Sidecar/<rid>/).
/ThirdPartyNotices.txt
