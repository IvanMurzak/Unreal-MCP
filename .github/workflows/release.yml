#
# Release pipeline (Godot-MCP release.yml skeleton, adapted for the UE three-leg
# mono-repo — docs/ARCHITECTURE.md §9.4). Shape:
#   check-version (read VersionName, ref/version/runner guards) -> test fan-out
#   -> artifact build -> sign plugin-source -> GATED publish (npm -> tag + GitHub
#   Release) -> verify-release -> Discord.
#
# ── Signed self-bootstrapping sidecar BUNDLE (docs/ARCHITECTURE.md §6, #51, #139) ──
# The self-contained `unreal-mcp-bridge` is built + code-signed per RID, then
# STAGED INTO the plugin tree before BuildPlugin, so the packaged plugin ships
# the signed sidecar for all four RIDs and is self-bootstrapping out of the box
# (no .NET install, no first-run download). Job graph:
#   check-version ─┬─ bridge (test)            ─┐
#                  ├─ test-cli                  │
#                  ├─ plugin (BuildPlugin+Auto) │  (test gate)
#                  ├─ build-bridge-macos  ──────┤  signs+notarizes osx, builds linux
#                  ├─ build-bridge-windows ─────┤  Azure-signs win-x64
#                  └─ build-plugin-zip ◄────────┘  downloads the 4 signed RID
#                        dirs, stages them under the FAB-SURVIVING source folder
#                        UnrealMCP/Source/ThirdParty/UnrealMcpBridge/<rid>/ (#139/#187;
#                        Fab strips Binaries/), emits the dedicated SOURCE install asset
#                        unreal-mcp-plugin-source-<version>.zip and the executable-free Fab
#                        asset unreal-mcp-plugin-fab-<version>.zip (both carry the bridge zips'
#                        SHA256SUMS, §6.8), runs BuildPlugin -Rocket
#                        (RuntimeDependencies stage Source/ThirdParty/UnrealMcpBridge/ ->
#                        Binaries/ThirdParty/UnrealMcpBridge/<rid>/), zips the PACKAGED
#                        plugin with the latest supported UE as unreal-mcp-plugin-<version>.zip ->
#                        publish-release attaches the three plugin zips + the 4 signed bridge zips.
# Signing is GRACEFULLY DEGRADING: every sign/notarize step is `if: env.X != ''`
# guarded, so a run with NO secrets produces UNSIGNED-but-green artifacts. The
# Unreal-MCP repo has no signing secrets yet (the owner mirrors the 9 from
# GameDev-MCP-Server out-of-band — see docs/RELEASING.md); this PR merges and
# runs green without them and begins signing the moment they exist.
# NOTE: artifacts pass between jobs, so a failed release MUST be FULL-rerun,
# never `gh run rerun --failed` (a partial rerun loses the bridge artifacts).
#
# ── Gating (read docs/RELEASING.md for the full contract) ──────────────────
# DISPATCH-ONLY: the ONLY trigger is a manual `workflow_dispatch` (the release
# train dispatches it on `main`). Merging a version bump to `main` publishes
# NOTHING. `UnrealMCP/UnrealMCP.uplugin` VersionName is the SINGLE source of truth
# for the release version (commands/bump_version.py keeps the other files in
# sync; check-version refuses a drifted cli/package.json or bridge csproj).
#
# check-version guards (fail in the FIRST job, before any test/build spend):
#   * ref guard     — a real run (dry_run=false) on any ref other than
#                     refs/heads/main FAILS.
#   * version guard — if tag `v<version>` already exists a real run FAILS (a
#                     dispatch never "succeeds" having done nothing); a dry run
#                     warns and continues.
#   * runner guard  — a real run with vars.UNREAL_RUNNER_READY != 'true' FAILS
#                     (otherwise the self-hosted plugin legs, and with them every
#                     publish job, would SKIP and the run would still go green).
#
# dry_run=true runs every test + build job (artifacts uploaded for inspection)
# and publishes NOTHING: publish-npm, publish-release (tag + Release),
# verify-release and publish_discord all carry a job-level
# `needs.check-version.outputs.dry_run != 'true'` guard and show as skipped.
#
# Publish order (so a re-dispatch after a failed publish is possible):
#   publish-npm (idempotent: skips if unreal-mcp-cli@<version> already exists)
#   -> publish-release (creates tag v<version> + GitHub Release + assets)
#   -> verify-release (npm version live + tag + all 7 release assets present)
#   -> publish_discord.
# A failure BEFORE publish-release leaves no tag, so the same version can simply
# be re-dispatched. The npm publish uses OIDC Trusted Publishing (no NPM_TOKEN)
# and MUST stay in this file (the Trusted Publisher is bound to release.yml).

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the release (run every test + build job) WITHOUT publishing to npm, tagging, creating a GitHub Release, or announcing in Discord."
        required: false
        default: false
        type: boolean

# Least-privilege default for the whole workflow; the publish jobs elevate
# their own permissions (contents: write for the Release, id-token: write for
# npm OIDC) in their job blocks.
permissions:
  contents: read

# Serialize release runs so the tag-existence check and the publish that follows
# cannot race two concurrent runs into a double publish (tag_exists TOCTOU).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Read the release version from the .uplugin and run the ref / version /
  # runner guards. A real run that cannot publish FAILS here, before any spend.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
    steps:
      # Ref guard FIRST (before checkout): a real release only ever ships `main`.
      - name: Resolve dry_run + ref guard
        id: gate
        env:
          # Typed `inputs` context (boolean, default false). Normalised to the
          # strings "true"/"false" so every downstream `if:` compares strings.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          dry_run=false
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            dry_run=true
          fi
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          if [ "${dry_run}" != "true" ] && [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::A real release (dry_run=false) may only be dispatched on refs/heads/main; this run is on '${REF}'. Re-dispatch on main, or pass -f dry_run=true to rehearse."
            exit 1
          fi
          echo "Gate: dry_run=${dry_run} ref=${REF}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # Dependency guard: the sidecar's NuGet pins, the vendored RQL C++ runtime and Code-Exec
      # releases, the extensions' minCoreVersion and the CLI's npm deps must all be published
      # releases, restored without a local feed. FAILS every run (dry runs too) while main
      # consumes a pre-release dependency, e.g. RQL from bridge/prerelease-packages/.
      - name: Release dependency guard (no pre-release / unpublished pins)
        shell: bash
        run: python3 scripts/release_dependency_guard.py

      - name: Get version from .uplugin VersionName
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '"VersionName"[[:space:]]*:[[:space:]]*"[^"]+"' UnrealMCP/UnrealMCP.uplugin \
            | head -n1 | sed -E 's/.*"VersionName"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "::error::Could not read VersionName from UnrealMCP/UnrealMCP.uplugin"
            exit 1
          fi
          # Strict semver gate: this value is interpolated into downstream steps
          # and npm run-scripts, so reject anything that is not a clean
          # MAJOR.MINOR.PATCH(+prerelease/build) before it can leak shell/JS.
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::VersionName '${version}' is not strict semver — refusing to release."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (tag v${version})"

      # Version-file lock-step (moved from the local release pipeline's classify
      # pre-flight): commands/bump_version.py writes the same version into the
      # .uplugin, the bridge csproj and cli/package.json(+lock). A divergence means
      # a partial/aborted bump — refuse rather than publish mismatched artifacts.
      - name: Verify version files agree
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(jq -r '.version' cli/package.json)"
          lock_version="$(jq -r '.version' cli/package-lock.json)"
          lock_root_version="$(jq -r '.packages[""].version' cli/package-lock.json)"
          csproj_version="$(sed -nE 's|.*<Version>([^<]+)</Version>.*|\1|p' bridge/src/com.IvanMurzak.Unreal.MCP.Bridge.csproj | head -n1)"
          echo "uplugin=${VERSION} cli/package.json=${cli_version} cli/package-lock.json=${lock_version}/${lock_root_version} bridge csproj=${csproj_version}"
          bad=0
          for pair in "cli/package.json:${cli_version}" "cli/package-lock.json:${lock_version}" "cli/package-lock.json(packages[\"\"]):${lock_root_version}" "bridge csproj:${csproj_version}"; do
            if [ "${pair##*:}" != "${VERSION}" ]; then
              echo "::error::${pair%:*} version '${pair##*:}' != UnrealMCP.uplugin VersionName '${VERSION}' (partial bump? re-run python commands/bump_version.py --new-version ${VERSION})."
              bad=1
            fi
          done
          if [ "${bad}" -ne 0 ]; then
            exit 1
          fi

      - name: Check if tag exists (version guard)
        id: tag_exists
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # The checkout above ran with fetch-tags: true, so local tags are
          # complete — no third-party action needed (avoids an unpinned tag ref).
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning::Tag ${TAG} already exists — a real run of this version would FAIL here. Continuing the dry run."
            else
              echo "::error::Tag ${TAG} already exists — version ${TAG#v} is already released. Bump UnrealMCP.uplugin VersionName (commands/bump_version.py) and merge before dispatching a release."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet."
          fi

      # Runner guard (moved from the local release pipeline's post-run check): the
      # self-hosted plugin + build-plugin-zip legs are gated on UNREAL_RUNNER_READY.
      # If they skip, every publish job skips too and the run concludes GREEN with
      # nothing published. A real run refuses that up front.
      - name: Runner guard (self-hosted UE runner must be ready)
        env:
          UNREAL_RUNNER_READY: ${{ vars.UNREAL_RUNNER_READY }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${UNREAL_RUNNER_READY}" = "true" ]; then
            echo "UNREAL_RUNNER_READY=true — the plugin Automation matrix and build-plugin-zip will run."
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "::warning::vars.UNREAL_RUNNER_READY is not 'true' — the plugin + build-plugin-zip legs will SKIP in this dry run, and a real run would FAIL here."
          else
            echo "::error::vars.UNREAL_RUNNER_READY is not 'true' — the self-hosted plugin legs would skip and nothing would publish. Register the runner / set the variable before a real release."
            exit 1
          fi

  # ── TEST GATE (runs on a real release OR a dry-run rehearsal) ──────────────

  bridge:
    name: bridge build + xUnit (${{ matrix.os }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore bridge/Unreal-MCP-Bridge.sln
      - name: Build
        run: dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-restore
      - name: Test
        run: dotnet test bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-build --verbosity normal

  test-cli:
    needs: [check-version]
    uses: ./.github/workflows/test_cli.yml

  # Plugin Automation gate — self-hosted, never red-by-absence (same
  # UNREAL_RUNNER_READY gate as test_pull_request.yml). For a REAL release the
  # runner MUST be registered (UNREAL_RUNNER_READY=true) — check-version FAILS a
  # real run otherwise, so a skipped plugin leg can never yield a green run that
  # published nothing. A dry run only warns. See docs/RELEASING.md.
  plugin:
    name: plugin BuildPlugin + Automation (UE ${{ matrix.ue }}, ${{ matrix.os }})
    needs: [check-version]
    if: vars.UNREAL_RUNNER_READY == 'true'
    # Matrix covers the supported UE 5.5/5.6/5.7/5.8 set; the single self-hosted
    # pool runs the legs (each on a machine carrying that engine's `unreal-5-x` label).
    # fail-fast:false so one engine's failure never cancels the others. Downstream
    # artifact / publish jobs that `needs: [plugin]` wait for ALL legs — so a
    # release is gated on the plugin passing Automation across the full supported
    # engine matrix.
    # Engine-versioned runner label (unreal-5-8 for UE 5.8): the job only lands on a machine
    # that has this engine installed. Expressions have no replace(), hence the lookup; an
    # unmapped version yields e.g. `unreal-5.10`, which no runner carries (add it to the map).
    # Deterministic OS coverage (unlike the PR legs, which take whichever OS is free): every engine
    # on Windows (Win64, MSVC) and the engines the macOS runner has on macOS (Mac, clang), each leg
    # pinned by its OS label. The .github/actions/ue-env action resolves that runner's engine install.
    # max-parallel 4: the machine-wide UE lock serializes the UE work per machine anyway, so this
    # only lets the two machines work at the same time.
    runs-on:
      - self-hosted
      - ${{ matrix.os }}
      - ${{ fromJSON('{"5.5":"unreal-5-5","5.6":"unreal-5-6","5.7":"unreal-5-7","5.8":"unreal-5-8","5.9":"unreal-5-9"}')[matrix.ue] || format('unreal-{0}', matrix.ue) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Interleaved: GitHub starts matrix legs in this order, so both machines start at once.
          - { os: windows, ue: '5.5' }
          - { os: macos, ue: '5.7' }
          - { os: windows, ue: '5.6' }
          - { os: macos, ue: '5.8' }
          - { os: windows, ue: '5.7' }
          - { os: windows, ue: '5.8' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false
          clean: false
      # This runner's engine and its bundled Python as CHAIN_PY, which runs every later step (ue_env.py).
      - name: Resolve UE install + chain python
        uses: ./.github/actions/ue-env
        with:
          version: ${{ matrix.ue }}
      # `clean: false` keeps gitignored files between jobs on this runner slot, and build-plugin-zip
      # stages the self-contained bridge into gitignored plugin folders. Remove them so this
      # BuildPlugin never packages a stale "bundled" bridge (see clean_staged_bridge in ue_ci.py).
      - name: Clean staged bridge binaries (gitignored)
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py clean-staged-bridge
      # Machine-wide UE serialization (#293): one lock for every self-hosted UE job on this
      # machine, whatever the engine version, so matrix legs, PR runs and chain dispatches never
      # share UAT. Held until the always() release step ending this job.
      # This job has no timeout-minutes (360 default), which covers the longer wait.
      - name: Acquire machine-wide UE lock
        id: ue_lock
        run: ${{ env.CHAIN_PY }} scripts/ue_machine_lock.py acquire --wait-minutes 180
      - name: BuildPlugin (marketplace packaging validation — DISTRIBUTED, test-free)
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py build-plugin-dist
      - name: Isolated compilation + one-editor Automation suite
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py suite --ue ${{ matrix.ue }}

      - name: Upload Automation report on failure
        # REPORT_DIR is exported only at the END of the Automation step; an
        # earlier failure (BuildPlugin, missing editor) leaves it unset, so guard
        # the upload to avoid a second confusing failure on an empty path.
        if: ${{ failure() && env.REPORT_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-report-${{ matrix.ue }}-${{ matrix.os }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      # Always the last step: cleanup, the lock release and the chain python link (`teardown` in ue_ci.py).
      - name: Teardown (cleanup, release the machine-wide UE lock)
        if: always() && env.CHAIN_PY != ''
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py teardown

  # ── ARTIFACT BUILD — SIGNED BRIDGE BUNDLE (runs on a real release OR a
  #    dry-run rehearsal). The self-contained bridge is built + code-signed per
  #    RID here, then (T4) STAGED INTO the plugin tree before BuildPlugin so the
  #    packaged plugin ships the signed sidecar (docs/ARCHITECTURE.md §6 BUNDLE
  #    model, issue #51). Signing is GRACEFULLY DEGRADING: every sign/notarize
  #    step is guarded `if: env.X != ''`, so a run with NO secrets still produces
  #    UNSIGNED-but-green artifacts. The Unreal-MCP repo has no signing secrets
  #    yet — this pipeline merges and runs green without them; it begins signing
  #    the moment the owner mirrors the GameDev-MCP-Server secret set.
  #    Platform split: codesign/notarytool are macOS-only and Azure Trusted
  #    Signing (signtool) is Windows-only, so the osx/linux RIDs build on a Mac
  #    runner and win-x64 builds on a Windows runner. ──────────────────────────

  # macOS + Linux: osx-arm64, osx-x64 (codesign + notarize), linux-x64
  # (unsigned, cross-built on the mac runner). Uploads the RAW per-RID publish
  # dirs (NOT zips) as artifacts so build-plugin-zip can stage them into the
  # plugin tree.
  build-bridge-macos:
    name: build bridge (macos + linux, signed)
    needs: [check-version]
    runs-on: macos-latest
    # Job-level env so the signing/notarization guards (`if: env.X != ''`) can
    # read these. A step's own `env:` is NOT visible to that same step's `if:` —
    # the condition is evaluated before step env is applied — so the
    # graceful-degradation guards MUST resolve their values at job scope.
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      # --no-zip: sign the raw apphost BEFORE zipping. Cross-build linux-x64
      # here too (no native linux toolchain needed for a portable self-contained
      # apphost); it ships unsigned (no Linux code-signing standard — matches
      # GameDev-MCP-Server).
      - name: Build self-contained bridge (osx + linux, no zip)
        run: python3 bridge/publish.py --configuration Release --platforms osx-arm64 osx-x64 linux-x64 --no-zip

      # Import the Developer ID Application certificate into a temporary
      # keychain. Guarded on ALL THREE mac signing secrets so a partial-secrets
      # dispatch skips the whole sign+notarize path cleanly rather than dying
      # under `set -e` and taking the unsigned-upload fallback down with it.
      - name: Import macOS signing certificate
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Code-sign each osx apphost with the hardened runtime + the bridge
      # entitlements (allow-jit + disable-library-validation — the .NET
      # single-file host JITs and loads runtime-extracted native libs). Signing
      # ONLY the apphost suffices for the shipped single-file form;
      # disable-library-validation is what makes the runtime-extracted libs
      # legal at exec time. Same all-three-secrets guard as the import step.
      - name: Code-sign macOS bridge (hardened runtime)
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          ENTITLEMENTS="build/entitlements.mac.plist"
          for rid in osx-arm64 osx-x64; do
            BIN="bridge/publish/${rid}/unreal-mcp-bridge"
            echo "Signing ${BIN}..."
            codesign --force --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" \
              --sign "$MAC_SIGN_IDENTITY" "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
          done

      # Notarize the two macOS apphosts. notarytool submits a ZIP, so zip each
      # signed osx dir to a throwaway notarization zip, submit, and require
      # status == "Accepted" (notarytool exits 0 even on Invalid/Rejected — the
      # exit code alone is NOT proof). The artifact we upload is the signed
      # publish DIR (not this zip) — the staged-into-plugin form is the binary,
      # not a zip. Notarization registers the binary's hash with Apple, so the
      # signed-and-notarized apphost passes Gatekeeper's first-exec check when
      # the editor spawns it (belt-and-suspenders with the T2 quarantine-xattr
      # strip for the offline case). Guarded on the signing secrets PLUS the
      # notarize API key — notarizing an unsigned binary is meaningless.
      - name: Notarize macOS bridge
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' && env.APPLE_API_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"

          for rid in osx-arm64 osx-x64; do
            NOTARIZE_ZIP="$RUNNER_TEMP/unreal-mcp-bridge-${rid}-notarize.zip"
            (cd "bridge/publish/${rid}" && zip -r "$NOTARIZE_ZIP" .)
            echo "Notarizing ${rid}..."
            SUBMIT_JSON="$(xcrun notarytool submit "$NOTARIZE_ZIP" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json)"
            echo "$SUBMIT_JSON"
            STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization for ${rid} did not succeed (status: ${STATUS:-unknown})"
              exit 1
            fi
            echo "Notarization for ${rid} accepted."
            rm -f "$NOTARIZE_ZIP"
          done

          rm -f "$KEY_PATH"

      # Upload the RAW signed per-RID publish dirs (staging input for the plugin
      # zip job) AND the per-RID release zips (kept as debugging /
      # UNREAL_MCP_BRIDGE_PATH artifacts on the GitHub Release).
      - name: Zip signed bridge dirs (release artifacts)
        run: python3 bridge/publish.py --zip-only --platforms osx-arm64 osx-x64 linux-x64
      - name: Upload signed bridge staging dirs (osx + linux)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-staging-osx-linux
          path: |
            ./bridge/publish/osx-arm64/
            ./bridge/publish/osx-x64/
            ./bridge/publish/linux-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bridge release zips (osx + linux)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-zips-osx-linux
          path: ./bridge/publish/*.zip
          if-no-files-found: error
          retention-days: 7

  # Windows: win-x64, signed via Azure Trusted Signing (signtool is
  # Windows-only). Built on windows-latest. Uploads the raw signed publish dir
  # (staging input) AND the release zip.
  build-bridge-windows:
    name: build bridge (windows, signed)
    needs: [check-version]
    runs-on: windows-latest
    # Job-level env so the Azure Trusted Signing guard (`if: env.AZURE_CLIENT_ID
    # != ''`) can read it — a step's own `env:` is not visible to that step's own
    # `if:`. See the macOS job's env comment for the rationale.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      # -NoZip: sign the raw .exe BEFORE zipping.
      - name: Build self-contained bridge (win-x64, no zip)
        run: python bridge/publish.py --configuration Release --platforms win-x64 --no-zip

      # Sign the win-x64 .exe via Azure Artifact Signing (formerly Trusted
      # Signing). Guarded: skipped when AZURE_CLIENT_ID is empty, leaving the
      # .exe unsigned but still stageable.
      - name: Sign Windows bridge (Azure Artifact Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: ivan-murzak
          certificate-profile-name: ai-game-dev-cert
          files-folder: ${{ github.workspace }}/bridge/publish/win-x64
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Zip signed bridge dir (release artifact)
        run: python bridge/publish.py --zip-only --platforms win-x64
      - name: Upload signed bridge staging dir (win)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-staging-win
          path: ./bridge/publish/win-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bridge release zip (win)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-zips-win
          path: ./bridge/publish/*.zip
          if-no-files-found: error
          retention-days: 7

  # NOTE: there is no server artifact job — the MCP server lives in its own
  # shared repo (IvanMurzak/GameDev-MCP-Server, assets gamedev-mcp-server-
  # <rid>.zip) and is released there; the CLI downloads the release pinned by
  # cli/src/lib/server-version.ts SERVER_VERSION.

  # Release plugin zips: the dedicated SOURCE install asset
  # `unreal-mcp-plugin-source-<version>.zip` (CLI install path, no
  # EngineVersion pin, test-free descriptor) AND the PACKAGED BuildPlugin asset
  # `unreal-mcp-plugin-<version>.zip` with the signed bridge bundled in under
  # Binaries/ThirdParty/. The single packaged artifact is built with the latest
  # supported UE; the source artifact stays engine-version unpinned and the
  # release matrix still validates the lower supported engines. Self-hosted,
  # gated like the plugin test job. Skipped when no runner is registered; for a
  # real release the runner must be ready (publish-release `needs` this job).
  # Depends on the plugin matrix so its UE 5.8 BuildPlugin cannot overlap the UE
  # 5.8 validation leg on the same machine's AutomationTool lock. Also depends
  # on the two signed-bridge jobs so the 4 signed RID payloads can be staged into
  # the plugin tree before the source asset is cut and BuildPlugin packages them
  # (docs/ARCHITECTURE.md §6 BUNDLE model, T4).
  build-plugin-zip:
    name: build plugin release zips (UE 5.8)
    needs: [check-version, plugin, build-bridge-macos, build-bridge-windows]
    if: vars.UNREAL_RUNNER_READY == 'true'
    # Windows only: this is the Fab Win64 package. The engine label must match the ue-env version below.
    runs-on: [self-hosted, windows, unreal-5-8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false
          clean: false
      # This runner's engine and its bundled Python as CHAIN_PY, which runs every later step (ue_env.py).
      - name: Resolve UE install + chain python
        uses: ./.github/actions/ue-env
        with:
          version: '5.8'
      # Start from a slot with no leftover staged bridge (a killed earlier run may have skipped
      # the always() clean at the end of this job). See clean_staged_bridge in ue_ci.py.
      - name: Clean staged bridge binaries (gitignored)
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py clean-staged-bridge
      # Download the signed per-RID publish dirs produced by the two
      # build-bridge-* jobs, merging all four RIDs under ./bridge-staging/<rid>/.
      # The two artifacts were rooted differently by upload-artifact:
      #   * bridge-staging-osx-linux was uploaded with THREE dir paths
      #     (osx-arm64/, osx-x64/, linux-x64/), so the artifact is rooted at
      #     their least-common-ancestor (bridge/publish/) and PRESERVES the
      #     top-level <rid>/ folders — extracting it to ./bridge-staging yields
      #     ./bridge-staging/<rid>/ directly.
      #   * bridge-staging-win was uploaded with a SINGLE dir path
      #     (./bridge/publish/win-x64/), so the artifact is rooted AT that dir
      #     and its contents are the win-x64 files WITHOUT the win-x64/ segment.
      #     Extract it into ./bridge-staging/win-x64 so the segment is restored
      #     and the staging loop below finds ./bridge-staging/win-x64/.
      - name: Download signed bridge (osx + linux)
        uses: actions/download-artifact@v8
        with:
          name: bridge-staging-osx-linux
          path: ./bridge-staging
      - name: Download signed bridge (win)
        uses: actions/download-artifact@v8
        with:
          name: bridge-staging-win
          path: ./bridge-staging/win-x64
      # The per-RID release zips (the exact bytes publish-release attaches): stage-bridge writes their SHA-256 into
      # the plugin (Source/ThirdParty/UnrealMcpBridge/SHA256SUMS), the trust anchor the editor verifies a downloaded
      # bridge against when the plugin ships without one (the Fab asset, docs/ARCHITECTURE.md §6.8).
      - name: Download bridge release zips (osx + linux)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-osx-linux
          path: ./bridge-zips
      - name: Download bridge release zip (win)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-win
          path: ./bridge-zips
      # Stage the signed binaries into the FAB-SURVIVING source folder the C++
      # resolver (FUnrealMcpSidecarManager::ComposeSurvivingBridgePath) and the
      # Build.cs RuntimeDependencies SOURCE arg both read (#139/#187):
      #   UnrealMCP/Source/ThirdParty/UnrealMcpBridge/<rid>/
      # This engine-canonical Source/ThirdParty/ folder survives a Fab strip
      # (Binaries/ is stripped) and is declared in Config/FilterPlugin.ini;
      # UnrealMcpRuntime.Build.cs's RuntimeDependencies two-arg (target,source) form
      # then STAGES it into the package's Binaries/ThirdParty/UnrealMcpBridge/<rid>/ at
      # BuildPlugin time. The payload files are gitignored — they exist only
      # transiently on the runner. If a future UBT does not stage them (design R6), the
      # post-BuildPlugin copy below populates the package's Binaries/ThirdParty path as a fallback.
      - name: Stage signed bridge into the Fab-surviving Source/ThirdParty folder
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py stage-bridge
      - name: Build source plugin zip
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py source-zip --version ${{ needs.check-version.outputs.version }}
      # The Fab submission asset: the source asset with no executable at all (Epic's Fab review accepts source files
      # only); the editor downloads + verifies the bridge instead (§6.8). The step fails if anything executable is left.
      - name: Build Fab plugin zip
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py fab-zip --version ${{ needs.check-version.outputs.version }}
      # Machine-wide UE serialization (#293) — see the plugin job. The source zip above runs no UE.
      - name: Acquire machine-wide UE lock
        run: ${{ env.CHAIN_PY }} scripts/ue_machine_lock.py acquire --wait-minutes 180
      - name: BuildPlugin + zip
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py plugin-zip --version ${{ needs.check-version.outputs.version }}
      - name: Upload source plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-source-zip
          path: ./dist/unreal-mcp-plugin-source-${{ needs.check-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload packaged plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-packaged-zip
          path: ./dist/unreal-mcp-plugin-${{ needs.check-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload Fab plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-fab-zip
          path: ./dist/unreal-mcp-plugin-fab-${{ needs.check-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      # Always the last step: cleanup, the lock release and the chain python link (`teardown` in ue_ci.py).
      - name: Teardown (cleanup, release the machine-wide UE lock)
        if: always() && env.CHAIN_PY != ''
        run: ${{ env.CHAIN_PY }} .github/scripts/ue_ci.py teardown

  # ── SIGN (no external side effect — runs on dry runs too, so a missing
  #    MINISIGN_SECRET_KEY is caught by the rehearsal and BEFORE any publish). ─
  sign-plugin-source:
    name: sign plugin-source zip (minisign)
    needs: [check-version, build-plugin-zip]
    runs-on: ubuntu-latest
    steps:
      - name: Download source plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-source-zip
          path: ./assets
      - name: Download Fab plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-fab-zip
          path: ./assets
      # Sign the plugin-SOURCE zip (and the Fab zip, the same source minus executables) with the pinned publisher key so the CLI can
      # VERIFY it before install (zero-config-engine-connect D12). A same-origin
      # SHA256 is integrity-only (a release-asset attacker swaps the zip AND its
      # checksum); a detached minisign (Ed25519) signature over an OFFLINE key is a
      # real supply-chain control. The CLI's `plugin-signature.ts` verifies this
      # `.minisig` against the baked-in `MINISIGN_PUBLIC_KEY`. FAIL-CLOSED: a real
      # release MUST be signed, so this step errors when `MINISIGN_SECRET_KEY` is
      # absent rather than publishing a source zip the CLI would then reject.
      # ⚠ Provisioning is a follow-up (see docs/RELEASING.md "Plugin-source signing
      # key"): mint a PASSWORDLESS keypair (`minisign -G -W`), add the secret-key
      # file as the repo secret `MINISIGN_SECRET_KEY`, and bake the public key into
      # `cli/src/lib/plugin-signature.ts`. Until then this step fails the release.
      # It runs on dry runs too (it publishes nothing), so a rehearsal proves the
      # key is usable before a real run reaches publish-npm.
      - name: Sign the plugin-source zip (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set. The plugin-source signing key must be provisioned before a release (docs/RELEASING.md 'Plugin-source signing key'). Refusing to publish an unsigned source zip the CLI would reject (fail-closed)."
            exit 1
          fi
          for kind in source fab; do
            if [ ! -f "./assets/unreal-mcp-plugin-${kind}-${VERSION}.zip" ]; then
              echo "::error::Plugin zip not found at ./assets/unreal-mcp-plugin-${kind}-${VERSION}.zip"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y minisign
          keyfile="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # The key is passwordless (minted with `minisign -G -W`), so signing does
          # not prompt; `< /dev/null` guards against any interactive read on a CI
          # runner with no tty. `-x` names the detached signature output.
          for kind in source fab; do
            zip="./assets/unreal-mcp-plugin-${kind}-${VERSION}.zip"
            minisign -S -s "$keyfile" -m "$zip" -x "${zip}.minisig" \
              -t "unreal-mcp plugin ${kind} ${VERSION} signed by AI Game Dev release CI" < /dev/null
            echo "Signed $zip -> ${zip}.minisig"
          done
          rm -f "$keyfile"
          ls -la ./assets
      - name: Upload plugin-source signature
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-source-minisig
          path: ./assets/unreal-mcp-plugin-source-${{ needs.check-version.outputs.version }}.zip.minisig
          if-no-files-found: error
          retention-days: 7
      - name: Upload Fab plugin signature
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-fab-minisig
          path: ./assets/unreal-mcp-plugin-fab-${{ needs.check-version.outputs.version }}.zip.minisig
          if-no-files-found: error
          retention-days: 7

  # ── PUBLISH (real runs only: every job below carries a job-level
  #    `needs.check-version.outputs.dry_run != 'true'` guard, so a dry run shows
  #    them all as skipped). Order: publish-npm -> publish-release (tag +
  #    Release) -> verify-release -> publish_discord. ──────────────────────────

  # Create the GitHub Release + `v<version>` tag with the bridge zips, the
  # dedicated SOURCE install asset, and the PACKAGED BuildPlugin zip attached.
  # (Server zips are released from the shared GameDev-MCP-Server repo, not here.)
  publish-release:
    name: publish GitHub Release
    # AFTER publish-npm (contract order: publish -> tag + Release), so a failed
    # npm publish leaves no tag and the same version can be re-dispatched.
    needs:
      [
        check-version,
        bridge,
        test-cli,
        plugin,
        build-bridge-macos,
        build-bridge-windows,
        build-plugin-zip,
        sign-plugin-source,
        publish-npm,
      ]
    if: inputs.dry_run != true && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.mark.outputs.published }}
      version: ${{ needs.check-version.outputs.version }}
      tag: ${{ needs.check-version.outputs.tag }}
      release_notes: ${{ steps.read_notes.outputs.release_body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Attach the three plugin artifacts:
      #   * unreal-mcp-plugin-source-<version>.zip  -> CLI source install asset
      #   * unreal-mcp-plugin-<version>.zip         -> packaged BuildPlugin artifact
      #   * unreal-mcp-plugin-fab-<version>.zip     -> Fab submission (source, no executable; §6.8)
      # The per-RID signed bridge zips are also attached for debugging /
      # UNREAL_MCP_BRIDGE_PATH users.
      - name: Download bridge release zips (osx + linux)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-osx-linux
          path: ./assets
      - name: Download bridge release zip (win)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-win
          path: ./assets
      - name: Download source plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-source-zip
          path: ./assets
      - name: Download packaged plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-packaged-zip
          path: ./assets
      - name: Download plugin-source signature
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-source-minisig
          path: ./assets
      - name: Download Fab plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-fab-zip
          path: ./assets
      - name: Download Fab plugin signature
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-fab-minisig
          path: ./assets
      - name: List assembled release assets
        run: ls -la ./assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Fail-closed: the CLI rejects an unsigned source zip (D12); the signatures
          # are produced by sign-plugin-source.
          for kind in source fab; do
            if [ ! -f "./assets/unreal-mcp-plugin-${kind}-${VERSION}.zip.minisig" ]; then
              echo "::error::Plugin signature ./assets/unreal-mcp-plugin-${kind}-${VERSION}.zip.minisig is missing — refusing to create the Release."
              exit 1
            fi
          done
          # Attach every zip AND the plugin `.minisig` signatures (D12).
          files=(./assets/*.zip ./assets/*.minisig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release zip assets found in ./assets"
            exit 1
          fi
          gh release create "${TAG}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
      - name: Mark publish success
        id: mark
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      # Expose the just-published release body as a job output so publish_discord
      # can announce it. Unlike Unity-MCP (which builds a release-notes artifact
      # and reads ./release-notes/release.md), this repo has NO release-notes
      # file — the body is GENERATED BY GITHUB via `gh release create
      # --generate-notes` above, so the only source is reading it back from the API.
      #
      # SAFETY: this step is purely informational and must NEVER be able to fail
      # the release. It runs AFTER `mark` (so `published` is already set), is
      # `continue-on-error`, and its script is internally non-fatal (no `set -e`,
      # every command `|| true`-guarded). Worst case the notes come back empty
      # and Discord gets the tag + release link.
      - name: Read release notes into job output
        id: read_notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -uo pipefail
          body=""
          for attempt in 1 2 3; do
            body="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' 2>/dev/null || true)"
            if [ -n "${body}" ]; then
              break
            fi
            echo "Generated release body not readable yet (attempt ${attempt}/3); retrying in 5s..."
            sleep 5
          done
          if [ -z "${body}" ]; then
            echo "::warning::Could not read the generated release body for ${TAG}; falling back to the tag name."
            body="Release ${TAG}"
          fi
          # Randomized heredoc delimiter so a release-notes line that happens to
          # match the sentinel cannot terminate the heredoc early.
          DELIM="ENDOFRELEASEBODY_$(openssl rand -hex 16)"
          {
            printf 'release_body<<%s\n' "$DELIM"
            printf '%s\n' "$body"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

  # Announce the just-cut GitHub Release in Discord (Unity-MCP parity — see the
  # `publish_discord` job in Unity-MCP's release.yml). LAST: nothing needs it, so a
  # webhook hiccup surfaces as a red job for visibility but can never block the
  # release or the npm publish (both already done).
  #
  # Fires ONLY after publish-release AND verify-release succeeded (implicit
  # success() on `needs`), and never on a dry run (job-level guard).
  publish_discord:
    name: announce release in Discord
    runs-on: ubuntu-latest
    needs: [check-version, publish-release, verify-release]
    if: inputs.dry_run != true && needs.check-version.outputs.dry_run != 'true'
    steps:
      - name: Send Release Notes to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_NOTES_WEBHOOK }}
          RELEASE_NOTES: ${{ needs.publish-release.outputs.release_notes }}
          VERSION: ${{ needs.publish-release.outputs.version }}
          TAG: ${{ needs.publish-release.outputs.tag }}
        run: |
          # Get the release notes from environment variables
          # (Using env vars avoids shell quoting issues with apostrophes in commit messages)
          release_notes="$RELEASE_NOTES"
          version="$VERSION"
          tag="$TAG"

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_NOTES_WEBHOOK is not configured — skipping the Discord announcement."
            exit 0
          fi

          # --- Unity-MCP formatting parity: synthesize the release-notes PREAMBLE ---
          # Unity-MCP hand-builds a `release.md` whose first lines are a
          # project+version heading, a "**Released:** *<date>*" line and a `---`
          # separator (see its `prepare-release-notes` job), and feeds that ONE file to
          # both the GitHub Release body and Discord — which is why its Discord post
          # opens with a large heading. This repo's release body is GitHub-generated
          # (`gh release create --generate-notes`), so it has no heading by
          # construction. Prepending the same preamble here, BEFORE the shared cleanup
          # below, makes the rendered Discord message identical in shape to Unity's.
          # `date +'%B %e, %Y'` is copied verbatim from Unity-MCP (%e is space-padded)
          # so the date renders character-for-character the same as Unity's.
          today=$(date +'%B %e, %Y')
          release_notes="$(printf '# AI Game Developer (Unreal MCP) %s\n**Released:** *%s*\n\n---\n\n%s\n' \
            "$tag" "$today" "$release_notes")"

          # Convert usernames to GitHub profile links
          # Convert "by @username" to "by [@username](https://github.com/username)"
          release_notes_with_links=$(echo "$release_notes" | sed -E 's/by @([A-Za-z0-9_-]+)/by [@\1](https:\/\/github.com\/\1)/g')

          # Remove horizontal separators (---) and clean up extra blank lines
          # 1. Remove lines containing only --- and whitespace
          # 2. Remove lines that contain only whitespace
          # 3. Compress multiple consecutive empty lines into one
          release_notes_cleaned=$(echo "$release_notes_with_links" | \
            sed '/^[[:space:]]*---[[:space:]]*$/d' | \
            sed 's/^[[:space:]]*$//' | \
            sed '/^$/N;/^\n$/d')

          # Create the release URL (the tag is `v<version>` from the .uplugin)
          release_url="https://github.com/${{ github.repository }}/releases/tag/${tag}"

          # Append the release link to the notes
          full_message="${release_notes_cleaned}"$'\n\n'"📦 **[View Full Release](${release_url})**"

          # Discord has a 2000 character limit, so we'll truncate if needed
          if [ ${#full_message} -gt 2000 ]; then
            # Remove lines from the end until it fits, keeping the link
            link_text=$'\n\n'"📦 **[View Full Release](${release_url})**"
            # The truncated message is reassembled as `<notes>` + `\n...` + `<link>`,
            # so the ellipsis line costs 4 more characters on top of the link. Budget
            # for BOTH so the assembled message is provably <= 2000 (Unity-MCP omits
            # the ellipsis from its budget and can emit 2004 chars, which Discord
            # rejects with a 400 — see the report on this change). The heading
            # synthesized above is part of `release_notes_cleaned` and is therefore
            # kept by the loop below (it is the first lines); it simply consumes
            # budget that would otherwise hold more note lines.
            ellipsis_text=$'\n'"..."
            max_length=$((2000 - ${#link_text} - ${#ellipsis_text}))

            # Split into lines and rebuild until we exceed the limit
            truncated_notes=""
            while IFS= read -r line; do
              test_notes="${truncated_notes}${line}"$'\n'
              if [ ${#test_notes} -gt $max_length ]; then
                break
              fi
              truncated_notes="$test_notes"
            done <<< "$release_notes_cleaned"

            # Add ellipsis on its own line if we truncated
            full_message="${truncated_notes}"$'\n'"...${link_text}"
          fi

          # Create JSON payload for Discord webhook
          # flags: 4 sets the SUPPRESS_EMBEDS flag to suppress embeds/link previews.
          # See: https://discord.com/developers/docs/resources/channel#create-message
          json_payload=$(jq -n \
            --arg content "$full_message" \
            '{content: $content, flags: 4}')

          # Send to the Discord webhook and GATE ON THE RESPONSE.
          #
          # curl exits 0 on an HTTP error status, so a bare `curl -X POST` proves only
          # that a request was attempted -- never that Discord accepted it. Capture the
          # status explicitly: 400 (payload over the 2000-char limit), 429 (rate
          # limited) and 401/404 (revoked or wrong webhook) all used to leave this job
          # green with no announcement posted and nothing in the log to say so. That
          # blind spot is how the truncation-budget bug fixed above went unnoticed.
          #
          # `--retry 3` covers only what a retry can fix -- curl's transient set (429,
          # 5xx and timeouts), honouring Discord's `Retry-After` header -- and
          # `--retry-max-time` bounds it. A 4xx other than 429 is a permanent rejection
          # and is never retried, and neither is a refused connection (that would need
          # `--retry-connrefused`); both fail fast and loudly below. Accepted tradeoff:
          # a webhook execute has no idempotency key, so a retry whose predecessor was
          # actually processed (response lost in flight) can post the announcement
          # twice. A duplicate announcement is strictly better than a missing one.
          #
          # The webhook URL is a credential: it is never echoed and `-v` is never
          # passed (curl's own `-S` error text names at most the host). The response
          # body IS printed -- it is Discord's JSON error object, the single most
          # useful thing for whoever debugs the next failure.
          response_file="$(mktemp)"
          curl_exit=0
          http_code=$(curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$json_payload" \
            --retry 3 \
            --retry-max-time 60 \
            -o "$response_file" \
            -w '%{http_code}') || curl_exit=$?

          # Safe to fail here: nothing downstream depends on this job and the release is
          # already published, so a red step cannot block or undo it. It DOES redden the
          # workflow run conclusion (and the release badge) -- that is the intended
          # visibility, and the message below states exactly what did and did not ship.
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Discord announcement for version ${version} was NOT delivered (curl exit ${curl_exit}). The release itself is published; only the announcement is missing."
            exit 1
          fi

          case "$http_code" in
            2??)
              echo "Release notes accepted by Discord for version ${version} (HTTP ${http_code})."
              ;;
            *)
              echo "::error::Discord REJECTED the release notes for version ${version} (HTTP ${http_code}). The release itself is published; only the announcement is missing."
              echo "Discord response body:"
              head -c 2000 "$response_file"
              echo ""
              exit 1
              ;;
          esac

  # Publish unreal-mcp-cli to npm via OIDC Trusted Publishing (no NPM_TOKEN secret).
  # The terminal publish leg of the plugin release; runs BEFORE the tag + GitHub
  # Release so a failure here is re-dispatchable. Needs the COMPLETE test + build
  # set. Idempotent: skips the publish when unreal-mcp-cli@<version> already exists.
  # The cli version is aligned to the release version at publish time.
  publish-npm:
    name: publish unreal-mcp-cli to npm
    needs:
      [
        check-version,
        bridge,
        test-cli,
        plugin,
        build-bridge-macos,
        build-bridge-windows,
        build-plugin-zip,
        sign-plugin-source,
      ]
    if: inputs.dry_run != true && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing — no NPM_TOKEN needed.
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Idempotency: HTTP 200 with a matching name+version => already published
      # (e.g. a re-dispatch after a later job failed) => skip the publish step.
      # 404 => not yet published. Anything else => fail rather than guess.
      - name: Check whether unreal-mcp-cli@<version> is already on npm
        id: npm_exists
        working-directory: .
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' "https://registry.npmjs.org/unreal-mcp-cli/${VERSION}")" || { echo "::error::npm registry query failed (curl)"; exit 1; }
          if [ "$code" = "200" ] && [ "$(jq -r '.name + "@" + .version' "$body")" = "unreal-mcp-cli@${VERSION}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::unreal-mcp-cli@${VERSION} is already published — the publish step will be skipped."
          elif [ "$code" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "unreal-mcp-cli@${VERSION} is not on npm yet."
          else
            echo "::error::Unexpected npm registry response (HTTP ${code}) for unreal-mcp-cli@${VERSION}."
            head -c 1000 "$body" || true
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # npm OIDC Trusted Publishing requires npm >= 11.5.1; the bundled npm is
      # older and would fail the token exchange with a masked E404.
      - name: Upgrade npm (OIDC Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@11
      - name: Align package version to the release version
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # NOTE: cli/package.json is `private: true` until the publish gate opens
      # (conventions.md). The owner removes that flag in the version-bump commit
      # that cuts the first real release; this step publishes the public package.
      - name: Publish to npm with provenance
        if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --access public --provenance

  # Post-publish verification (moved from the local release pipeline's
  # wait-release-and-npm step). The run is green only if unreal-mcp-cli@<version>
  # is queryable on npm AND the GitHub Release for v<version> carries every asset
  # the CLI / consumers download.
  verify-release:
    name: verify published release
    needs: [check-version, publish-npm, publish-release]
    if: inputs.dry_run != true && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify unreal-mcp-cli@<version> is live on npm
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -uo pipefail
          url="https://registry.npmjs.org/unreal-mcp-cli/${VERSION}"
          body="$(mktemp)"
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            code="$(curl -sS -o "$body" -w '%{http_code}' "$url" || echo "curl-failed")"
            if [ "$code" = "200" ] && [ "$(jq -r '.name + "@" + .version' "$body" 2>/dev/null)" = "unreal-mcp-cli@${VERSION}" ]; then
              echo "unreal-mcp-cli@${VERSION} is live on npm."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::unreal-mcp-cli@${VERSION} is NOT queryable on npm after 300s (last HTTP ${code})."
              exit 1
            fi
            echo "npm not serving ${VERSION} yet (HTTP ${code}); retrying in 30s..."
            sleep 30
          done
      - name: Verify tag + GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,assets)"
          tag_name="$(jq -r '.tagName' <<<"$release_json")"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          if [ "$tag_name" != "$TAG" ] || [ "$is_draft" != "false" ]; then
            echo "::error::Release for ${TAG} is wrong: tagName=${tag_name} isDraft=${is_draft}."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} is not present on the remote."
            exit 1
          fi
          names="$(jq -r '.assets[].name' <<<"$release_json")"
          missing=0
          for asset in \
            "unreal-mcp-plugin-${VERSION}.zip" \
            "unreal-mcp-plugin-source-${VERSION}.zip" \
            "unreal-mcp-plugin-source-${VERSION}.zip.minisig" \
            "unreal-mcp-plugin-fab-${VERSION}.zip" \
            "unreal-mcp-plugin-fab-${VERSION}.zip.minisig" \
            "unreal-mcp-bridge-win-x64.zip" \
            "unreal-mcp-bridge-osx-arm64.zip" \
            "unreal-mcp-bridge-osx-x64.zip" \
            "unreal-mcp-bridge-linux-x64.zip"; do
            if grep -qxF -- "$asset" <<<"$names"; then
              echo "present: $asset"
            else
              echo "::error::Release ${TAG} is missing asset: $asset"
              missing=1
            fi
          done
          exit "$missing"
      # A Fab install downloads the attached bridge zips and accepts them only if they match the SHA256SUMS shipped
      # inside the plugin (docs/ARCHITECTURE.md §6.8): prove the published bytes and the shipped digests agree.
      - name: Verify the bridge zips match the plugin's SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bridge-verify"
          mkdir -p "$dir"
          cd "$dir"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "unreal-mcp-plugin-fab-${VERSION}.zip" --pattern 'unreal-mcp-bridge-*.zip'
          unzip -p "unreal-mcp-plugin-fab-${VERSION}.zip" UnrealMCP/Source/ThirdParty/UnrealMcpBridge/SHA256SUMS > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
