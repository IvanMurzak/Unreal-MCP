<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How it works: an AI agent talks MCP to the server (ai-game.dev cloud or a local gamedev-mcp-server); the server relays over SignalR to the unreal-mcp-bridge .NET sidecar, which reaches the UnrealMCP C++ plugin inside the Unreal Editor over loopback TCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <!-- request paths (left to right) and reply paths (right to left) -->
    <path id="a1" d="M260 132 L340 132"/><path id="b1" d="M340 152 L260 152"/>
    <path id="a2" d="M560 132 L640 132"/><path id="b2" d="M640 152 L560 152"/>
    <path id="a3" d="M860 132 L940 132"/><path id="b3" d="M940 152 L860 152"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .head { font-size: 12px; letter-spacing: 2px; fill: #64748b; font-weight: 700; }
    .card { fill: #0f172a; stroke: #1e293b; }
    .t1 { font-size: 15px; font-weight: 600; fill: #e2e8f0; }
    .t2 { font-size: 12px; fill: #94a3b8; }
    .wl { font-size: 12px; font-weight: 700; fill: #cbd5e1; }
    .ws { font-size: 11px; fill: #64748b; }
    .wire { fill: none; stroke-width: 1.6; stroke-dasharray: 4 6; }
    .chip .box { fill: #111c35; stroke: #273454; }
    .chip text { font-size: 12px; fill: #cbd5e1; }
    .chip .hl { fill: #22d3ee; fill-opacity: .1; stroke: #67e8f9; stroke-width: 1.4; opacity: 0; animation: hl 8s ease-in-out infinite; }
    @keyframes hl { 0%, 14%, 100% { opacity: 0; } 4%, 9% { opacity: 1; } }
    .c2 .hl { animation-delay: 1s; } .c3 .hl { animation-delay: 2s; } .c4 .hl { animation-delay: 3s; }
    .c5 .hl { animation-delay: 4s; } .c6 .hl { animation-delay: 5s; } .c7 .hl { animation-delay: 6s; } .c8 .hl { animation-delay: 7s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)" class="sans">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>

    <text x="40" y="54" class="head">AI AGENT</text>
    <text x="340" y="54" class="head">MCP SERVER</text>
    <text x="640" y="54" class="head">SIDECAR</text>
    <text x="940" y="54" class="head">UNREAL EDITOR</text>

    <!-- wires -->
    <g>
      <use href="#a1" class="wire" stroke="#22d3ee"/><use href="#b1" class="wire" stroke="#e879f9"/>
      <use href="#a2" class="wire" stroke="#22d3ee"/><use href="#b2" class="wire" stroke="#e879f9"/>
      <use href="#a3" class="wire" stroke="#22d3ee"/><use href="#b3" class="wire" stroke="#e879f9"/>
    </g>
    <g>
      <circle r="3.5" fill="#67e8f9"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="3.5" fill="#67e8f9"><animateMotion dur="1.6s" begin=".5s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="3.5" fill="#67e8f9"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
      <circle r="3.5" fill="#f0abfc"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle>
      <circle r="3.5" fill="#f0abfc"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
      <circle r="3.5" fill="#f0abfc"><animateMotion dur="1.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
    </g>
    <text x="300" y="118" text-anchor="middle" class="wl">MCP</text>
    <text x="300" y="174" text-anchor="middle" class="ws">http / stdio</text>
    <text x="600" y="118" text-anchor="middle" class="wl">SignalR</text>
    <text x="600" y="174" text-anchor="middle" class="ws">relay</text>
    <text x="900" y="118" text-anchor="middle" class="wl">TCP IPC</text>
    <text x="900" y="174" text-anchor="middle" class="ws">loopback</text>

    <!-- cards -->
    <g>
      <rect x="40" y="82" width="220" height="120" rx="12" class="card"/><rect x="40" y="82" width="4" height="120" rx="2" fill="#22d3ee"/>
      <text x="60" y="112" class="t1">Your AI agent</text>
      <text x="60" y="138" class="t2">Claude Code, Cursor,</text>
      <text x="60" y="156" class="t2">Copilot, Codex, Gemini,</text>
      <text x="60" y="174" class="t2">any MCP client</text>

      <rect x="340" y="82" width="220" height="120" rx="12" class="card"/><rect x="340" y="82" width="4" height="120" rx="2" fill="#818cf8"/>
      <text x="360" y="112" class="t1">MCP server</text>
      <text x="360" y="138" class="t2">ai-game.dev cloud (default)</text>
      <text x="360" y="156" class="t2">or a local</text>
      <text x="360" y="174" class="mono t2">gamedev-mcp-server</text>

      <rect x="640" y="82" width="220" height="120" rx="12" class="card"/><rect x="640" y="82" width="4" height="120" rx="2" fill="#a78bfa"/>
      <text x="660" y="112" class="mono t1">unreal-mcp-bridge</text>
      <text x="660" y="138" class="t2">.NET 9 sidecar, McpPlugin</text>
      <text x="660" y="156" class="t2">started and restarted</text>
      <text x="660" y="174" class="t2">by the plugin</text>
    </g>

    <!-- the plugin -->
    <rect x="940" y="82" width="220" height="120" rx="14" fill="#0d1428" stroke="url(#edge)" stroke-width="2" stroke-opacity=".85"/>
    <text x="960" y="112" class="mono t1">UnrealMCP</text>
    <text x="960" y="138" class="t2">C++ editor plugin</text>
    <text x="960" y="156" class="t2">tools run on the</text>
    <text x="960" y="174" class="t2">game thread</text>

    <!-- tool families -->
    <text x="40" y="254" class="head">30 BUILT-IN TOOLS · 8 FAMILIES</text>
    <g transform="translate(40 272)">
      <g class="chip c1"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#22d3ee"/><text x="30" y="23">RQL data · 3</text></g>
      <g class="chip c2" transform="translate(140 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#818cf8"/><text x="30" y="23">Blueprint · 11</text></g>
      <g class="chip c3" transform="translate(280 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#a78bfa"/><text x="30" y="23">C++ source · 6</text></g>
      <g class="chip c4" transform="translate(420 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#e879f9"/><text x="30" y="23">Screenshot · 4</text></g>
      <g class="chip c5" transform="translate(560 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#f472b6"/><text x="30" y="23">Fab · 3</text></g>
      <g class="chip c6" transform="translate(700 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#fbbf24"/><text x="30" y="23">Console · 1</text></g>
      <g class="chip c7" transform="translate(840 0)"><rect class="box" width="130" height="38" rx="10"/><rect class="hl" width="130" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#34d399"/><text x="30" y="23">Python · 1</text></g>
      <g class="chip c8" transform="translate(980 0)"><rect class="box" width="140" height="38" rx="10"/><rect class="hl" width="140" height="38" rx="10"/><circle cx="18" cy="19" r="4" fill="#67e8f9"/><text x="30" y="23">Tool list · 1</text></g>
    </g>

    <text x="600" y="362" text-anchor="middle" font-size="13" fill="#64748b">The plugin listens on loopback; the sidecar dials it with a one-shot token sent over stdin. Extensions add RQL modules and tools.</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
