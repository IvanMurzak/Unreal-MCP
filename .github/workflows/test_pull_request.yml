# Pull-request CI aggregator (Unity-MCP / Godot-MCP parity, adapted for the UE
# three-leg mono-repo — docs/ARCHITECTURE.md §9.3/§9.4). Fans out with fail-fast
# disabled so every leg reports independently:
#   (a) bridge  — dotnet build + xUnit on hosted ubuntu-latest + windows-latest
#   (b) cli     — unreal-mcp-cli node 20/22 tests via the reusable test_cli.yml
#   (c) plugin  — UE 5.7 BuildPlugin + Automation specs (UnrealMcp. filter) on a
#                 SELF-HOSTED windows runner labelled `unreal-5-7`
#   (d) connection-smoke — live relay round-trip (client -> gamedev-mcp-server ->
#                 sidecar -> plugin -> editor -> tool), self-hosted, gated on a
#                 SEPARATE dormant `vars.UNREAL_SMOKE_READY` (owner-enabled after a
#                 one-time runner validation; see the job + docs/RELEASING.md)
#
# (There is no server leg: the MCP server lives in the shared
# IvanMurzak/GameDev-MCP-Server repo and is tested/released there. Leg (d) pulls
# the public server release at runtime; it does not build the server here.)
#
# Self-hosted runner is NEVER red-by-absence: job (c) is gated on the repository
# variable `vars.UNREAL_RUNNER_READY == 'true'`. While that variable is unset
# (no runner registered), job (c) is SKIPPED — a skipped job does not fail the
# PR, and the hosted legs (a)/(b) still give full PR signal. Once the owner
# registers the runner they set the variable to `true` (see docs/RELEASING.md)
# and the plugin leg becomes a live required-when-available check. The label
# `unreal-5-7` is deliberately distinct from any M1/M4 release-runner label so
# PR compiles do not starve release capacity (§9.4 constraint).
name: test-pull-request

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Least-privilege: PR test jobs only read the checked-out source.
permissions:
  contents: read

# Auto-cancel superseded runs when a new commit is pushed to the same PR so
# intermediate pushes don't pile up runner time (§03-implement push-early note).
concurrency:
  group: test-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # (a) bridge — .NET 9 sidecar build + xUnit on BOTH hosted OSes (the sidecar
  # ships per-RID binaries, so cross-OS test coverage matters). 0 errors / 0
  # failures required.
  bridge:
    name: bridge build + xUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore bridge/Unreal-MCP-Bridge.sln

      - name: Build
        run: dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-build --verbosity normal

  # (b) cli — unreal-mcp-cli node tests (Node 20 & 22) via the reusable workflow.
  test-cli:
    uses: ./.github/workflows/test_cli.yml

  # (c) plugin — UE 5.7 BuildPlugin (also validates marketplace packaging) +
  # Automation specs on the self-hosted runner. Gated on UNREAL_RUNNER_READY so
  # it never reds a PR by runner absence (see header). The job parses the
  # exported Automation index.json (NOT the editor exit code, which is
  # unreliable for test failures — test.md Suite 3) and fails on any failed
  # test or a missing report.
  plugin:
    name: plugin BuildPlugin + Automation (UE ${{ matrix.ue }})
    # Gated on the runner being registered AND — for pull_request events — the PR
    # originating from THIS repo, never a fork. A fork PR must never execute its
    # checked-out code on the self-hosted runner (see docs/RELEASING.md). Manual
    # dispatches (trusted) are unaffected by the fork clause.
    if: ${{ vars.UNREAL_RUNNER_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # The matrix runs UE 5.7 and 5.8 as parallel jobs; the single self-hosted
    # runner (label `unreal-5-7`, legacy name) executes them sequentially. Both
    # engines are installed at the standard Epic paths on the runner.
    # fail-fast:false so one engine's failure never cancels the other's leg.
    runs-on: [self-hosted, windows, unreal-5-7]
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.7', '5.8']
    env:
      # Engine path is driven by the matrix (standard Epic install layout).
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      # Absolute path on the runner to a host .uproject with the UnrealMCP plugin
      # available (the runner's local Unreal-Test-Project analog). Required for
      # the Automation pass; BuildPlugin alone does not need it. A "Sync host to
      # UE_ROOT" step below rebuilds the host's own game module for the matrix
      # engine, so one host project serves both engines.
      HOST_UPROJECT: ${{ vars.UNREAL_HOST_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false

      - name: BuildPlugin (marketplace packaging validation — DISTRIBUTED, test-free)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # C2 (#139): this validates the DISTRIBUTED package — the committed
          # UnrealMCP.uplugin omits the UnrealMcpEditorTests module (Fab review flags
          # shipped test/automation modules), so this BuildPlugin -Rocket proves the
          # marketplace package builds green WITHOUT the test module. The Automation
          # pass below rebuilds WITH the test module into a separate junction target.
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $runUAT)) { throw "RunUAT.bat not found at $runUAT — set the UNREAL_ENGINE_PATH repo variable." }
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Dist-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "Distributed BuildPlugin failed with exit code $LASTEXITCODE" }
          # Guard: the packaged distributed plugin must NOT carry the test module.
          $distUplugin = Join-Path $package 'UnrealMCP.uplugin'
          if (Test-Path $distUplugin) {
            $mods = (Get-Content $distUplugin -Raw | ConvertFrom-Json).Modules.Name
            # Defensive: a null $mods (unreadable/empty Modules array) makes the
            # `-contains` below silently $false and defeats the C2 guard — fail loud.
            if (-not $mods) { throw "Could not read Modules from distributed .uplugin at $distUplugin — refusing to pass the C2 guard blind." }
            if ($mods -contains 'UnrealMcpEditorTests') {
              throw "Distributed package SHIPS UnrealMcpEditorTests — Fab review would flag it (C2 regression)."
            }
          }

      - name: Run Automation specs (UnrealMcp. filter — test module rebuilt in)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set — the Automation pass needs a host .uproject with the UnrealMCP plugin enabled (see docs/RELEASING.md)."
          }
          # C2 (#139): the host project's Plugins\UnrealMCP junctions to the package
          # at $RUNNER_TEMP\UnrealMCP-Package (docs/RELEASING.md). The distributed
          # package above is test-free, so to run the specs we transiently ADD the
          # UnrealMcpEditorTests module, BuildPlugin into that junction target (so the
          # package the host loads CONTAINS the specs), run Automation, then ALWAYS
          # revert the descriptor in finally (the toggle is idempotent — a crashed run
          # never leaves the committed descriptor wedged).
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $toggle = Join-Path $env:GITHUB_WORKSPACE 'commands\test-module-uplugin.ps1'
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          & $toggle -Action Add
          try {
            $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
            if (Test-Path $package) { Remove-Item $package -Recurse -Force }
            & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
            if ($LASTEXITCODE -ne 0) { throw "Automation BuildPlugin (with test module) failed with exit code $LASTEXITCODE" }
            # Rebuild the host's OWN game module for THIS matrix engine so the editor
            # opens without an out-of-date-modules failure (the host's committed
            # Binaries may be built for a different UE version, and an -unattended
            # editor will NOT interactively rebuild). The plugin is already current
            # via the BuildPlugin into the host's Plugins junction above; this builds
            # the host shell + the junctioned plugin for UE_ROOT.
            $hostBuild = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
            $hostTarget = [System.IO.Path]::GetFileNameWithoutExtension($env:HOST_UPROJECT) + 'Editor'
            & $hostBuild $hostTarget Win64 Development -project="$env:HOST_UPROJECT" -WaitMutex
            if ($LASTEXITCODE -ne 0) { throw "Host editor target ($hostTarget) build failed for UE_ROOT=$env:UE_ROOT (exit $LASTEXITCODE)" }
            $editorCmd = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
            $reportDir = Join-Path $env:RUNNER_TEMP 'AutomationReport'
            if (Test-Path $reportDir) { Remove-Item $reportDir -Recurse -Force }
            & $editorCmd "$env:HOST_UPROJECT" -nullrhi -nosplash -unattended `
              -ExecCmds="Automation RunTests UnrealMcp.; Quit" `
              -ReportExportPath="$reportDir" -log
            # The editor's exit code is unreliable for test verdicts (test.md
            # Suite 3); the parsed index.json below is authoritative. Clear the
            # exit code so pwsh's auto-appended `exit $LASTEXITCODE` does not red
            # the step on a nonzero editor exit unrelated to a test failure.
            $global:LASTEXITCODE = 0
            echo "REPORT_DIR=$reportDir" >> $env:GITHUB_ENV
          }
          finally {
            & $toggle -Action Remove
          }

      - name: Parse Automation report (index.json is authoritative)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Join-Path $env:REPORT_DIR 'index.json'
          if (-not (Test-Path $index)) {
            throw "Automation index.json is MISSING at $index — the run crashed or produced no report (treat as FAILURE, not the 0/0 no-specs case)."
          }
          # The report is UTF-8 with BOM (utf-8-sig); ConvertFrom-Json handles the BOM.
          $report = Get-Content $index -Raw | ConvertFrom-Json
          $failed = [int]$report.failed
          $succeeded = [int]$report.succeeded
          # UE counts specs that pass while emitting a warning under a SEPARATE
          # succeededWithWarnings field; fold it into the pass tally so a
          # clean-but-warned suite is not misread as the 0-specs case below.
          $succeededWithWarnings = [int]$report.succeededWithWarnings
          $passed = $succeeded + $succeededWithWarnings
          Write-Host "Automation results: succeeded=$succeeded succeededWithWarnings=$succeededWithWarnings failed=$failed"
          if ($failed -gt 0) { throw "$failed Automation test(s) failed." }
          if ($passed -lt 1) { throw "No Automation tests succeeded (succeeded=$succeeded succeededWithWarnings=$succeededWithWarnings) — expected at least one UnrealMcp. spec." }
          Write-Host "Plugin Automation: all specs passed."

      - name: Upload Automation report on failure
        # REPORT_DIR is exported only at the END of the Automation step; an
        # earlier failure (BuildPlugin, missing editor) leaves it unset, so guard
        # the upload to avoid a second confusing failure on an empty path.
        if: ${{ failure() && env.REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  # (d) connection + tool smoke — the live RELAY path the Automation specs do NOT
  # cover: a real MCP client -> gamedev-mcp-server -> sidecar -> plugin -> editor
  # round-trip, exercised by the self-contained scripts/connection_smoke.py
  # (--mode custom: it DOWNLOADS the public gamedev-mcp-server release, runs it in
  # streamableHttp mode, launches the host editor in Custom mode, and calls a tool
  # battery over POST /mcp). No infra-repo dependency; the server is fetched from
  # the public GameDev-MCP-Server releases.
  #
  # Gated on a DEDICATED `vars.UNREAL_SMOKE_READY == 'true'` (NOT the plugin
  # runner var), so it stays SKIPPED — never red-by-absence — until the owner has
  # validated it once on the runner and flips the variable. Prerequisites the
  # owner confirms before enabling (see docs/RELEASING.md):
  #   • the host project (`vars.UNREAL_HOST_PROJECT`) has the UnrealMCP plugin
  #     COMPILED (the plugin leg / runner setup builds it); and
  #   • a bridge sidecar is resolvable — this job builds it and exports
  #     UNREAL_MCP_BRIDGE_PATH (PR builds do not bundle the §6 sidecar; only the
  #     release job does).
  connection-smoke:
    name: connection + tool smoke (UE ${{ matrix.ue }}, custom server)
    if: ${{ vars.UNREAL_SMOKE_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, unreal-5-7]
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.7', '5.8']
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      HOST_UPROJECT: ${{ vars.UNREAL_HOST_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `actions/setup-dotnet` or `actions/setup-python`: this self-hosted
      # runner runs as NT AUTHORITY\NETWORK SERVICE, which cannot write to
      # C:\Program Files\dotnet (setup-dotnet throws) and whose tool-cache Python
      # install (setup-python) also fails. Instead we use what the runner already
      # has read-only under Program Files: the system .NET 9 SDK + runtime for the
      # bridge build (below), and UE's bundled Python 3.11
      # (Engine\Binaries\ThirdParty\Python3\Win64\python.exe — has ssl) to run the
      # stdlib-only smoke script.
      - name: Build bridge sidecar (for UNREAL_MCP_BRIDGE_PATH override)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug
          if ($LASTEXITCODE -ne 0) { throw "bridge build failed ($LASTEXITCODE)" }
          $bridge = Join-Path $env:GITHUB_WORKSPACE 'bridge\src\bin\Debug\net9.0\unreal-mcp-bridge.exe'
          if (-not (Test-Path $bridge)) { throw "bridge binary not found at $bridge" }
          echo "UNREAL_MCP_BRIDGE_PATH=$bridge" >> $env:GITHUB_ENV

      - name: BuildPlugin into the host junction target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set (see docs/RELEASING.md)."
          }
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          # This job runs in its OWN context — RUNNER_TEMP is cleaned per job, so the
          # plugin leg's package is gone. The host project's Plugins\UnrealMCP junctions
          # to $RUNNER_TEMP\UnrealMCP-Package (docs/RELEASING.md); BuildPlugin there so
          # the host editor loads THIS PR's plugin for the smoke. (PR BuildPlugin does
          # not bundle the §6 sidecar — that is why UNREAL_MCP_BRIDGE_PATH is set above.)
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed ($LASTEXITCODE)" }
          # Rebuild the host's own game module for THIS matrix engine so the smoke's
          # editor launch does not fail on out-of-date modules (the committed host
          # Binaries may be built for a different UE version; -unattended will not
          # interactively rebuild). The plugin is current via the junction above.
          $hostBuild = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $hostTarget = [System.IO.Path]::GetFileNameWithoutExtension($env:HOST_UPROJECT) + 'Editor'
          & $hostBuild $hostTarget Win64 Development -project="$env:HOST_UPROJECT" -WaitMutex
          if ($LASTEXITCODE -ne 0) { throw "Host editor target ($hostTarget) build failed for UE_ROOT=$env:UE_ROOT (exit $LASTEXITCODE)" }

      - name: Run connection + tool smoke (custom local server)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set — the smoke needs a host .uproject with the UnrealMCP plugin compiled (see docs/RELEASING.md)."
          }
          $editorCmd = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $py = Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          if (-not (Test-Path $py)) { throw "UE bundled Python not found at $py" }
          # --mode custom downloads the public gamedev-mcp-server release, runs it,
          # launches the editor in Custom mode, and asserts the tool battery. The
          # bridge override (UNREAL_MCP_BRIDGE_PATH, set above) is inherited by the
          # editor the script spawns.
          & $py scripts/connection_smoke.py --mode custom --project "$env:HOST_UPROJECT" --ue "$editorCmd" --server-port 18080 --timeout 240
          if ($LASTEXITCODE -ne 0) { throw "connection + tool smoke FAILED (exit $LASTEXITCODE)" }
