name: release-extension

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin name, comma-separated names, or all (versions are read from source)
        required: true
        type: string
      dry_run:
        description: Test and package without publishing
        default: true
        type: boolean
      bootstrap_index:
        description: Explicitly initialize the download index on the first publication only
        default: false
        type: boolean

# Serialize ALL component publication and index read/modify/write, including different tags.
concurrency:
  group: unreal-extension-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.validate.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Extensions build against the core: every pin it ships must be a published release (dry runs fail too).
      - name: Release dependency guard (no pre-release / unpublished pins)
        run: python3 scripts/release_dependency_guard.py
      - name: Validate component and publication branch
        id: validate
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          import extension_release as release
          requested = os.environ['PLUGIN']
          plugins = list(release.components()) if requested == 'all' else list(dict.fromkeys(p.strip() for p in requested.split(',')))
          if not plugins or any(p not in release.components() for p in plugins):
              raise SystemExit('Unknown extension')
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Release workflow must run on main')
          for plugin in plugins:
              release.validate(plugin)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('plugins=' + json.dumps(plugins) + '\n')
          PY
      - name: Test release and suite tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    needs: validate
    # Required, no readiness skip: a release cannot pass without its engine checks.
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.7', '5.8']
    # Any OS carrying the engine label (see test_pull_request.yml's plugin job).
    runs-on:
      - self-hosted
      - ${{ fromJSON('{"5.7":"unreal-5-7","5.8":"unreal-5-8"}')[matrix.ue] }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build CLI for live E2E
        working-directory: cli
        run: npm ci && npm run build
      # This runner's engine install (any OS) and the chain python (UE's bundled Python 3.11 behind a
      # space-free link): exports UE_ROOT, UE_PLATFORM, UE_RUNUAT and CHAIN_PY. See the script header.
      - name: Resolve UE install + chain python
        shell: pwsh
        run: ./.github/scripts/ue-env.ps1 -Version '${{ matrix.ue }}'
      - name: Acquire machine-wide UE lock
        shell: pwsh
        run: ./.github/scripts/ue-machine-lock.ps1 -Action Acquire
      - name: Isolated builds and all Automation/E2E checks in one editor
        shell: pwsh
        run: |
          & $env:CHAIN_PY scripts/extension_suite.py --engine $env:UE_ROOT --mode full --ue-lock-held --result-file .artifacts/suite-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Full extension suite failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: extension-suite-${{ matrix.ue }}
          path: .artifacts/suite-result.json
          if-no-files-found: error
      - name: Release machine-wide UE lock
        if: always()
        shell: pwsh
        run: |
          ./.github/scripts/ue-machine-lock.ps1 -Action Release
          ./.github/scripts/ue-env.ps1 -RemoveLink

  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGINS: ${{ needs.validate.outputs.plugins }}
      DRY_RUN: ${{ inputs.dry_run }}
      BOOTSTRAP: ${{ inputs.bootstrap_index }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package only the selected extension; publish after all gates pass
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          action = 'package' if os.environ['DRY_RUN'] == 'true' else 'publish'
          for number, plugin in enumerate(json.loads(os.environ['PLUGINS'])):
              args = ['python3', 'scripts/extension_release.py', action, '--plugin', plugin]
              if number == 0 and os.environ['BOOTSTRAP'] == 'true':
                  args.append('--bootstrap-index')
              subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: .artifacts/releases/*.zip
          if-no-files-found: error
