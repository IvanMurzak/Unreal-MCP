# Pull-request CI aggregator (Unity-MCP / Godot-MCP parity, adapted for the UE
# three-leg mono-repo — docs/ARCHITECTURE.md §9.3/§9.4). Fans out with fail-fast
# disabled so every leg reports independently:
#   (a) bridge  — dotnet build + xUnit on hosted ubuntu-latest + windows-latest
#   (b) cli     — unreal-mcp-cli node 20/22 tests via the reusable test_cli.yml
#   (c) plugin  — UE 5.8 BuildPlugin + Automation specs (UnrealMcp. filter) on a
#                 SELF-HOSTED windows runner labelled `unreal-5-7`
#   (d) connection-smoke — live relay round-trip (client -> gamedev-mcp-server ->
#                 sidecar -> plugin -> editor -> tool), self-hosted, gated on a
#                 SEPARATE dormant `vars.UNREAL_SMOKE_READY` (owner-enabled after a
#                 one-time runner validation; see the job + docs/RELEASING.md)
#
# (There is no server leg: the MCP server lives in the shared
# IvanMurzak/GameDev-MCP-Server repo and is tested/released there. Leg (d) pulls
# the public server release at runtime; it does not build the server here.)
#
# Machine-wide UE lock (#293): the self-hosted UE jobs (c) and (d) each hold one lock shared by
# EVERY UE job on the machine (PR runs, chain dispatches of any lock, release legs), taken by
# `.github/scripts/ue-machine-lock.ps1` around their UE steps — see docs/RELEASING.md
# "Machine-wide UE lock". The run-level `concurrency:` below is unchanged and does not do this.
#
# Self-hosted runner is NEVER red-by-absence: job (c) is gated on the repository
# variable `vars.UNREAL_RUNNER_READY == 'true'`. While that variable is unset
# (no runner registered), job (c) is SKIPPED — a skipped job does not fail the
# PR, and the hosted legs (a)/(b) still give full PR signal. Once the owner
# registers the runner they set the variable to `true` (see docs/RELEASING.md)
# and the plugin leg becomes a live required-when-available check. The label
# `unreal-5-7` is deliberately distinct from any M1/M4 release-runner label so
# PR compiles do not starve release capacity (§9.4 constraint).
#
# Chain leg (node `unreal-mcp`, driven from ai-game-dev-software `.scripts/chain/`):
# under `workflow_dispatch` the SAME jobs take the chain lock JSON (`lock`) and its
# 8-hex hash (`lock_hash8`), and `.github/scripts/chain_feed.py` (VENDORED,
# byte-identical to ai-game-dev-software `.scripts/chain/leg/chain_feed.py` — edit
# there, re-vendor) self-builds the lower layers the lock pins and proves each job
# consumed them. Per-job edge scope, passed identically to `apply` and `record`:
#   bridge            --edges nuget                        ReflectorNet + McpPlugin feed
#   test-cli          --edges npm                          cli-core tarball (test_cli.yml)
#   plugin            --edges none                         C++ consumes nothing: sha assertion + record
#   connection-smoke  --edges nuget --edges server-binary  bridge feed + the self-built
#                                                          server as UNREAL_MCP_SERVER_PATH
# `.github/scripts/chain_leg_checks.py` (repo-owned, NOT vendored) adds the pin-drift
# warning and the xUnit-project identity proof. The self-hosted jobs have no Python on
# PATH, so they junction UE's bundled Python 3.11 to a space-free CHAIN_PY under
# RUNNER_TEMP. On every other run each chain step logs
# "chain: no lock (ordinary run)" and exits 0, or is skipped.
name: test-pull-request

on:
  workflow_dispatch:
    inputs:
      lock:
        description: the chain lock JSON (<= 60000 characters)
        required: true
        type: string
      lock_hash8:
        description: first 8 hex characters of the lock hash
        required: true
        type: string
  pull_request:
    # `chain-testing` is the chain-testing integration branch: without it a PR into
    # that branch would get no CI at all.
    branches: [main, chain-testing]
    types: [opened, synchronize, reopened]

# Empty on ordinary runs => GitHub's default title. The chain dispatcher captures a
# dispatched run by this exact title + headSha.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chain {0} unreal-mcp', inputs.lock_hash8) || '' }}

# Least-privilege: PR test jobs only read the checked-out source.
permissions:
  contents: read

# Empty on every event but workflow_dispatch (`inputs` is empty there).
env:
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

# Ordinary runs (unchanged): auto-cancel superseded runs when a new commit is pushed
# to the same PR so intermediate pushes don't pile up runner time (§03-implement
# push-early note). Dispatched chain runs: one group per lock with cancel-in-progress
# off — cancelling a job on the self-hosted Unreal pool wedges the runner. Different
# locks run independently and wait for a free runner; a re-dispatch of the SAME lock
# waits for the running one (GitHub keeps at most one pending run per group and
# replaces it, which is harmless: a pending run holds no runner).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('chain-{0}-{1}', inputs.lock_hash8, github.workflow) || format('test-pr-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && true }}

jobs:
  # (a) bridge — .NET 9 sidecar build + xUnit on BOTH hosted OSes (the sidecar
  # ships per-RID binaries, so cross-OS test coverage matters). 0 errors / 0
  # failures required.
  bridge:
    name: bridge build + xUnit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang guard, not a budget.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # Chain leg: resolve the interpreter once, then — under a lock — self-build
      # ReflectorNet + McpPlugin into a local feed and force the bridge csproj's pins to
      # the lock's exact ws versions BEFORE the first restore.
      - name: chain python (posix)
        if: runner.os != 'Windows' && env.CHAIN_PY == ''
        shell: bash
        run: |
          for c in python3 python; do
            if "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' >/dev/null 2>&1; then
              echo "CHAIN_PY=$c" >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo 'chain: no Python 3.9+ on PATH (tried python3, python)' >&2; exit 2

      - name: chain python (windows)
        if: runner.os == 'Windows' && env.CHAIN_PY == ''
        shell: pwsh
        run: |
          foreach ($c in 'python', 'py', 'python3') {
            if (-not (Get-Command $c -ErrorAction SilentlyContinue)) { continue }
            $global:LASTEXITCODE = $null
            & $c -c 'import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)' 2>$null
            if ($LASTEXITCODE -eq 0) { "CHAIN_PY=$c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; exit 0 }
          }
          [Console]::Error.WriteLine('chain: no Python 3.9+ on PATH (tried python, py, python3)'); exit 2

      - name: chain feed
        id: chain
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node unreal-mcp --job bridge --edges nuget

      - name: Restore
        run: dotnet restore bridge/Unreal-MCP-Bridge.sln

      - name: Build
        run: dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-restore

      - name: Test
        run: dotnet test bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-build --verbosity normal

      # `record` proves only bridge/src (the RECIPES pin). The xUnit project restores on its
      # own, so prove BOTH assets files resolved the lock's ws packages (exit 3 otherwise).
      - name: chain identity (bridge + test project)
        if: env.CHAIN_ACTIVE == '1'
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_leg_checks.py assets-identity --job bridge --edges nuget --project bridge/src/com.IvanMurzak.Unreal.MCP.Bridge.csproj --project bridge/tests/com.IvanMurzak.Unreal.MCP.Bridge.Tests.csproj

      - name: chain pin drift
        if: always() && env.CHAIN_ACTIVE == '1'
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_leg_checks.py pin-drift --job bridge --edges nuget

      # Identity proof + per-job leg record: exit 3 on any failed proof => this job is RED
      # even if its tests passed. `--job-status` makes a failed/cancelled job record red.
      - name: chain leg record
        id: chain_record
        if: always()
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node unreal-mcp --job bridge --edges nuget --job-status ${{ job.status }} "--warn=${{ env.CHAIN_PIN_DRIFT }}" --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json

  # (b) cli — unreal-mcp-cli node tests (Node 20 & 22) via the reusable workflow.
  # A reusable workflow does not inherit this workflow's `env`, so the chain lock is
  # forwarded as inputs (both empty on an ordinary run).
  test-cli:
    uses: ./.github/workflows/test_cli.yml
    with:
      lock: ${{ inputs.lock }}
      lock_hash8: ${{ inputs.lock_hash8 }}

  # (c) plugin — UE 5.8 BuildPlugin (also validates marketplace packaging) +
  # Automation specs on the self-hosted runner. Gated on UNREAL_RUNNER_READY so
  # it never reds a PR by runner absence (see header). The job parses the
  # exported Automation index.json (NOT the editor exit code, which is
  # unreliable for test failures — test.md Suite 3) and fails on any failed
  # test or a missing report.
  plugin:
    name: plugin BuildPlugin + Automation (UE ${{ matrix.ue }})
    # Gated on the runner being registered AND — for pull_request events — the PR
    # originating from THIS repo, never a fork. A fork PR must never execute its
    # checked-out code on the self-hosted runner (see docs/RELEASING.md). Manual
    # dispatches (trusted) are unaffected by the fork clause.
    if: ${{ vars.UNREAL_RUNNER_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # PR-gating is intentionally scoped to UE 5.8 ONLY so the self-hosted PR
    # signal stays on the latest supported engine while keeping the runner load
    # bounded. The runner label remains `unreal-5-7` for legacy reasons only.
    # fail-fast:false so one engine's failure never cancels the other's leg.
    runs-on: [self-hosted, windows, unreal-5-7]
    # A hang guard, not a budget. Expiry IS a GitHub-side cancel and can wedge this
    # self-hosted runner exactly like a manual cancel, so it is sized to fire only on a real
    # hang. Never cancel a slow job by hand: kill the step's process on the box instead.
    # 180 = the machine-wide UE lock's 120-min bounded wait + the original 60-min guard, so an
    # expired wait fails the Acquire step instead of cancelling the job.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.8']
    env:
      # Engine path is driven by the matrix (standard Epic install layout).
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      # Absolute path on the runner to a host .uproject with the UnrealMCP plugin
      # available (the runner's local Unreal-Test-Project analog). Required for
      # the Automation pass; BuildPlugin alone does not need it. A "Sync host to
      # UE_ROOT" step below rebuilds the host's own game module for the matrix
      # engine, so one host project serves both engines.
      HOST_UPROJECT: ${{ vars.UNREAL_HOST_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false
          clean: false

      # Chain leg. This runner account has no Python on PATH; UE's bundled Python 3.11 is the
      # only interpreter, and it lives under "C:\Program Files\..." — a path with spaces that
      # ${{ env.CHAIN_PY }} (substituted UNQUOTED) would split. Junction its folder to a
      # space-free path under RUNNER_TEMP, prove it runs, and export that as CHAIN_PY.
      - name: chain python (UE bundled, space-free path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64'
          if (-not (Test-Path -LiteralPath (Join-Path $src 'python.exe'))) { throw "chain: UE bundled Python not found under $src" }
          if ($env:RUNNER_TEMP -match '\s') { throw "chain: RUNNER_TEMP '$env:RUNNER_TEMP' contains whitespace; CHAIN_PY must be space-free" }
          $link = Join-Path $env:RUNNER_TEMP 'chain-py'
          if (Test-Path -LiteralPath $link) {
            # A LINK only: plain rmdir removes the junction, never the engine files behind it.
            cmd /c rmdir "$link" 2>$null
            if (Test-Path -LiteralPath $link) { throw "chain: could not remove stale $link" }
          }
          cmd /c mklink /J "$link" "$src" | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "chain: mklink /J $link -> $src failed (exit $LASTEXITCODE)" }
          $py = Join-Path $link 'python.exe'
          & $py -c "import sys; print('chain: python', sys.version); sys.exit(0 if sys.version_info >= (3, 9) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "chain: $py is not a runnable Python 3.9+ (exit $LASTEXITCODE)" }
          "CHAIN_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The C++ plugin consumes nothing from the chain: under a lock, only assert that the lock's
      # unreal-mcp sha is this run's commit, then record.
      - name: chain feed
        id: chain
        shell: pwsh
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node unreal-mcp --job plugin --edges none

      # Machine-wide UE serialization (#293). Every runner-manager runner on this machine shares
      # one UE install (AutomationTool is single-instance) and the host Plugins\UnrealMCP
      # junction, so a run-level `concurrency:` group cannot keep two UE jobs apart, and a
      # job-level group would CANCEL an older pending job. Held from here until the always()
      # release step that ends this job; a killed job frees it when the holder or the job's
      # Runner.Worker exits. Mechanics: .github/scripts/ue-machine-lock.ps1.
      - name: Acquire machine-wide UE lock
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\ue-machine-lock.ps1" -Action Acquire -WaitMinutes 120

      - name: BuildPlugin (marketplace packaging validation — DISTRIBUTED, test-free)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # C2 (#139): this validates the DISTRIBUTED package — the committed
          # UnrealMCP.uplugin omits the UnrealMcpEditorTests module (Fab review flags
          # shipped test/automation modules), so this BuildPlugin -Rocket proves the
          # marketplace package builds green WITHOUT the test module. The Automation
          # pass below rebuilds WITH the test module into a separate junction target.
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $runUAT)) { throw "RunUAT.bat not found at $runUAT — set the UNREAL_ENGINE_PATH repo variable." }
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Dist-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "Distributed BuildPlugin failed with exit code $LASTEXITCODE" }
          # Guard: the packaged distributed plugin must NOT carry the test module.
          $distUplugin = Join-Path $package 'UnrealMCP.uplugin'
          if (Test-Path $distUplugin) {
            $mods = (Get-Content $distUplugin -Raw | ConvertFrom-Json).Modules.Name
            # Defensive: a null $mods (unreadable/empty Modules array) makes the
            # `-contains` below silently $false and defeats the C2 guard — fail loud.
            if (-not $mods) { throw "Could not read Modules from distributed .uplugin at $distUplugin — refusing to pass the C2 guard blind." }
            if ($mods -contains 'UnrealMcpEditorTests') {
              throw "Distributed package SHIPS UnrealMcpEditorTests — Fab review would flag it (C2 regression)."
            }
          }

      - name: Resolve runner-local host project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $runnerLocalHost = Join-Path $runnerRoot 'host\UnrealTestProject\UnrealTestProject.uproject'
          if (Test-Path $runnerLocalHost) {
            "HOST_UPROJECT=$runnerLocalHost" >> $env:GITHUB_ENV
            Write-Host "Using runner-local host project: $runnerLocalHost"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path $env:HOST_UPROJECT)) {
            Write-Host "Using UNREAL_HOST_PROJECT fallback: $env:HOST_UPROJECT"
          } else {
            throw "No host .uproject found. Expected runner-local '$runnerLocalHost' or a valid UNREAL_HOST_PROJECT repo variable."
          }

      - name: Run Automation specs (UnrealMcp. filter — test module rebuilt in)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set — the Automation pass needs a host .uproject with the UnrealMCP plugin enabled (see docs/RELEASING.md)."
          }
          # C2 (#139): the host project's Plugins\UnrealMCP junctions to the package
          # at $RUNNER_TEMP\UnrealMCP-Package (docs/RELEASING.md). The distributed
          # package above is test-free, so to run the specs we transiently ADD the
          # UnrealMcpEditorTests module, BuildPlugin into that junction target (so the
          # package the host loads CONTAINS the specs), run Automation, then ALWAYS
          # revert the descriptor in finally (the toggle is idempotent — a crashed run
          # never leaves the committed descriptor wedged).
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $toggle = Join-Path $env:GITHUB_WORKSPACE 'commands\test-module-uplugin.ps1'
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          & $toggle -Action Add
          try {
            $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
            if (Test-Path $package) { Remove-Item $package -Recurse -Force }
            & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
            if ($LASTEXITCODE -ne 0) { throw "Automation BuildPlugin (with test module) failed with exit code $LASTEXITCODE" }
            # SELF-HEAL the host's Plugins\UnrealMCP junction (docs/RELEASING.md invariant).
            # The junction MUST point at the per-run BuildPlugin output ($package =
            # $RUNNER_TEMP\UnrealMCP-Package), which INCLUDES the UnrealMcpEditorTests
            # module just built above — so the UnrealMcp.* Automation specs register.
            # Off-workflow dev tooling (worktree.py / testbed.py / a manual mklink) can
            # silently repoint this junction at the Fab-clean submodule source (whose
            # distributed .uplugin OMITS the test module -> 0 specs -> "index.json
            # MISSING"), reding every PR. Force-recreate it here so a clobbered junction
            # auto-recovers. Idempotent: we drop any existing reparse point/dir first,
            # then mklink /J. $package was just populated by the BuildPlugin above, so
            # the target is present.
            $hostPluginsDir = Join-Path (Split-Path -Parent $env:HOST_UPROJECT) 'Plugins'
            $hostJunction = Join-Path $hostPluginsDir 'UnrealMCP'
            New-Item -ItemType Directory -Force -Path $hostPluginsDir | Out-Null
            if (Test-Path -LiteralPath $hostJunction) {
              # Remove whatever is there (junction/dir/reparse point) without following it.
              cmd /c rmdir "$hostJunction" 2>$null
              if (Test-Path -LiteralPath $hostJunction) { Remove-Item -LiteralPath $hostJunction -Recurse -Force }
            }
            cmd /c mklink /J "$hostJunction" "$package" | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "Failed to (re)create host junction $hostJunction -> $package (exit $LASTEXITCODE)" }
            # Assert it now resolves to THIS run's package (so a stale target can't slip through).
            $resolved = (Get-Item -LiteralPath $hostJunction).Target
            Write-Host "Host junction: $hostJunction -> $resolved (expected $package)"
            # Rebuild the host's OWN game module for THIS matrix engine so the editor
            # opens without an out-of-date-modules failure (the host's committed
            # Binaries may be built for a different UE version, and an -unattended
            # editor will NOT interactively rebuild). The plugin is already current
            # via the BuildPlugin into the host's Plugins junction above; this builds
            # the host shell + the junctioned plugin for UE_ROOT. IMPORTANT:
            # force -NoLiveCoding on the self-hosted service runner — UE 5.8's UBT
            # can otherwise probe the global LiveCoding mutex and die with
            # UnauthorizedAccessException under the service account.
            $hostBuild = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
            $hostTarget = [System.IO.Path]::GetFileNameWithoutExtension($env:HOST_UPROJECT) + 'Editor'
            $hostBuildLog = Join-Path $env:RUNNER_TEMP "UBT-$hostTarget-$($env:GITHUB_JOB)-$($env:RUNNER_NAME).log"
            & $hostBuild $hostTarget Win64 Development -project="$env:HOST_UPROJECT" -WaitMutex -NoLiveCoding -log="$hostBuildLog"
            if ($LASTEXITCODE -ne 0) { throw "Host editor target ($hostTarget) build failed for UE_ROOT=$env:UE_ROOT (exit $LASTEXITCODE)" }
            $editorCmd = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
            $reportDir = Join-Path $env:RUNNER_TEMP 'AutomationReport'
            if (Test-Path $reportDir) { Remove-Item $reportDir -Recurse -Force }
            & $editorCmd "$env:HOST_UPROJECT" -nullrhi -nosplash -unattended `
              -ExecCmds="Automation RunTests UnrealMcp.; Quit" `
              -ReportExportPath="$reportDir" -log
            # The editor's exit code is unreliable for test verdicts (test.md
            # Suite 3); the parsed index.json below is authoritative. Clear the
            # exit code so pwsh's auto-appended `exit $LASTEXITCODE` does not red
            # the step on a nonzero editor exit unrelated to a test failure.
            $global:LASTEXITCODE = 0
            echo "REPORT_DIR=$reportDir" >> $env:GITHUB_ENV
          }
          finally {
            & $toggle -Action Remove
          }

      - name: Parse Automation report (index.json is authoritative)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Join-Path $env:REPORT_DIR 'index.json'
          if (-not (Test-Path $index)) {
            throw "Automation index.json is MISSING at $index — the run crashed or produced no report (treat as FAILURE, not the 0/0 no-specs case)."
          }
          # The report is UTF-8 with BOM (utf-8-sig); ConvertFrom-Json handles the BOM.
          $report = Get-Content $index -Raw | ConvertFrom-Json
          $failed = [int]$report.failed
          $succeeded = [int]$report.succeeded
          # UE counts specs that pass while emitting a warning under a SEPARATE
          # succeededWithWarnings field; fold it into the pass tally so a
          # clean-but-warned suite is not misread as the 0-specs case below.
          $succeededWithWarnings = [int]$report.succeededWithWarnings
          $passed = $succeeded + $succeededWithWarnings
          Write-Host "Automation results: succeeded=$succeeded succeededWithWarnings=$succeededWithWarnings failed=$failed"
          if ($failed -gt 0) { throw "$failed Automation test(s) failed." }
          if ($passed -lt 1) { throw "No Automation tests succeeded (succeeded=$succeeded succeededWithWarnings=$succeededWithWarnings) — expected at least one UnrealMcp. spec." }
          Write-Host "Plugin Automation: all specs passed."

      - name: Upload Automation report on failure
        # REPORT_DIR is exported only at the END of the Automation step; an
        # earlier failure (BuildPlugin, missing editor) leaves it unset, so guard
        # the upload to avoid a second confusing failure on an empty path.
        if: ${{ failure() && env.REPORT_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      # Per-job leg record: the sha assertion's outcome + every out-of-scope edge as a
      # named skip. `--job-status` makes a failed/cancelled job record `result: red`.
      - name: chain leg record
        id: chain_record
        if: always()
        shell: pwsh
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node unreal-mcp --job plugin --edges none --engine unreal --engine-version ${{ matrix.ue }} --job-status ${{ job.status }} --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json

      - name: Cleanup this job's build outputs (self-hosted disk hygiene)
        # Self-hosted disk hygiene. This runner is SHARED with other repos' jobs and
        # its RUNNER_TEMP + the persistent runner-local host project are NOT auto-pruned
        # after a job, so per-run BuildPlugin packages and host logs accumulate across
        # runs (a contributor to disk-full spikes during heavy concurrent CI). Remove
        # ONLY THIS job's own regenerable outputs. Deliberately NOT touched:
        #   • host DerivedDataCache / Intermediate / Binaries — a persistent
        #     shared-for-speed cache; deleting it forces a full shader/host recompile
        #     every run (§ guardrail: never prune a cache other runs rely on for speed).
        #   • the host Plugins\UnrealMCP junction — owned by the self-heal step above.
        #   • Docker — these UE jobs use no containers, and the daemon is shared with
        #     the context-engine / ai-pipeline runners' ACTIVE jobs.
        # Best-effort: a cleanup failure must NEVER red an otherwise-green run.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Remove-Tree([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p) -or -not (Test-Path -LiteralPath $p)) { return }
            Write-Host "Removing $p"
            cmd /c rmdir /s /q "$p" 2>$null
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          # 0. The chain python junction: remove the LINK first (plain rmdir, never a recursive
          #    delete that could follow it into the engine install), then the leg record.
          $chainPy = Join-Path $env:RUNNER_TEMP 'chain-py'
          if (Test-Path -LiteralPath $chainPy) { cmd /c rmdir "$chainPy" 2>$null }
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'chain-leg.json') -Force -ErrorAction SilentlyContinue
          # 1. This job's per-run BuildPlugin / report outputs under RUNNER_TEMP.
          foreach ($name in @('UnrealMCP-Package','UnrealMCP-Dist-Package','UnrealMCP-Source-Package','AutomationReport')) {
            Remove-Tree (Join-Path $env:RUNNER_TEMP $name)
          }
          # 2. This job's UBT logs under RUNNER_TEMP.
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'UBT-*.log' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # 3. Host project transient logs/crashes ONLY (unbounded growers; NOT the
          #    DDC / Intermediate / Binaries speed caches).
          if (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path -LiteralPath $env:HOST_UPROJECT)) {
            $hostRoot = Split-Path -Parent $env:HOST_UPROJECT
            foreach ($sub in @('Saved\Logs','Saved\Crashes')) { Remove-Tree (Join-Path $hostRoot $sub) }
          }
          Write-Host "Per-run cleanup done (DDC / Intermediate / Binaries and Docker intentionally preserved)."

      # Last step, so everything from BuildPlugin through the host-log cleanup stays inside the
      # machine-wide UE lock. A no-op when Acquire never ran; never fails the job.
      - name: Release machine-wide UE lock
        if: always()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\ue-machine-lock.ps1" -Action Release

  # (d) connection + tool smoke — the live RELAY path the Automation specs do NOT
  # cover: a real MCP client -> gamedev-mcp-server -> sidecar -> plugin -> editor
  # round-trip, exercised by the self-contained scripts/connection_smoke.py
  # (--mode custom: it DOWNLOADS the public gamedev-mcp-server release, runs it in
  # streamableHttp mode, launches the host editor in Custom mode, and calls a tool
  # battery over POST /mcp). No infra-repo dependency; the server is fetched from
  # the public GameDev-MCP-Server releases.
  #
  # Gated on a DEDICATED `vars.UNREAL_SMOKE_READY == 'true'` (NOT the plugin
  # runner var), so it stays SKIPPED — never red-by-absence — until the owner has
  # validated it once on the runner and flips the variable. Prerequisites the
  # owner confirms before enabling (see docs/RELEASING.md):
  #   • the host project (`vars.UNREAL_HOST_PROJECT`) has the UnrealMCP plugin
  #     COMPILED (the plugin leg / runner setup builds it); and
  #   • a bridge sidecar is resolvable — this job builds it and exports
  #     UNREAL_MCP_BRIDGE_PATH (PR builds do not bundle the §6 sidecar; only the
  #     release job does).
  connection-smoke:
    name: connection + tool smoke (UE ${{ matrix.ue }}, custom server)
    needs: [plugin]
    if: ${{ vars.UNREAL_SMOKE_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, unreal-5-7]
    # A hang guard, not a budget — see the plugin job: expiry is a GitHub-side cancel.
    # 150 = the machine-wide UE lock's 120-min bounded wait + the original 30-min guard.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.8']
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      HOST_UPROJECT: ${{ vars.UNREAL_HOST_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          clean: false

      # Chain leg — same space-free UE Python junction as the plugin job.
      - name: chain python (UE bundled, space-free path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64'
          if (-not (Test-Path -LiteralPath (Join-Path $src 'python.exe'))) { throw "chain: UE bundled Python not found under $src" }
          if ($env:RUNNER_TEMP -match '\s') { throw "chain: RUNNER_TEMP '$env:RUNNER_TEMP' contains whitespace; CHAIN_PY must be space-free" }
          $link = Join-Path $env:RUNNER_TEMP 'chain-py'
          if (Test-Path -LiteralPath $link) {
            # A LINK only: plain rmdir removes the junction, never the engine files behind it.
            cmd /c rmdir "$link" 2>$null
            if (Test-Path -LiteralPath $link) { throw "chain: could not remove stale $link" }
          }
          cmd /c mklink /J "$link" "$src" | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "chain: mklink /J $link -> $src failed (exit $LASTEXITCODE)" }
          $py = Join-Path $link 'python.exe'
          & $py -c "import sys; print('chain: python', sys.version); sys.exit(0 if sys.version_info >= (3, 9) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "chain: $py is not a runnable Python 3.9+ (exit $LASTEXITCODE)" }
          "CHAIN_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `clean: false` keeps untracked files between runs on this persistent workspace, so a
      # chain run whose cleanup never ran (a killed job) would leave its generated nuget.config /
      # Directory.Build.targets behind and silently re-point the NEXT ordinary bridge build at a
      # local feed. Remove only files carrying the chain's own GENERATED marker (the text of
      # GENERATED_MARKER in the vendored chain_feed.py — keep in sync on re-vendor), plus the feed.
      - name: chain sweep stale overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'nuget.config', 'Directory.Build.targets') {
            $p = Join-Path $env:GITHUB_WORKSPACE $name
            if ((Test-Path -LiteralPath $p) -and ((Get-Content -LiteralPath $p -Raw) -match 'GENERATED by chain\.py')) {
              Remove-Item -LiteralPath $p -Force
              Write-Host "chain: removed stale generated $p"
            }
          }
          $feed = Join-Path $env:GITHUB_WORKSPACE '.artifacts'
          if (Test-Path -LiteralPath $feed) { Remove-Item -LiteralPath $feed -Recurse -Force; Write-Host "chain: removed stale $feed" }

      # Under a lock: clone ReflectorNet / MCP-Plugin-dotnet / GameDev-MCP-Server at the lock
      # shas, build them with the SYSTEM .NET SDK (no setup-dotnet here, see below), force the
      # bridge csproj's pins to the lock's ws versions, publish the win-x64 server with its
      # chain-identity.json marker and export UNREAL_MCP_SERVER_PATH — BEFORE the bridge build.
      - name: chain feed
        id: chain
        shell: pwsh
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py apply --node unreal-mcp --job connection-smoke --edges nuget --edges server-binary

      # No `actions/setup-dotnet` or `actions/setup-python`: this self-hosted
      # runner runs as NT AUTHORITY\NETWORK SERVICE, which cannot write to
      # C:\Program Files\dotnet (setup-dotnet throws) and whose tool-cache Python
      # install (setup-python) also fails. Instead we use what the runner already
      # has read-only under Program Files: the system .NET 9 SDK + runtime for the
      # bridge build (below), and UE's bundled Python 3.11
      # (Engine\Binaries\ThirdParty\Python3\Win64\python.exe — has ssl) to run the
      # stdlib-only smoke script.
      - name: Build bridge sidecar (for UNREAL_MCP_BRIDGE_PATH override)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug
          if ($LASTEXITCODE -ne 0) { throw "bridge build failed ($LASTEXITCODE)" }
          $bridge = Join-Path $env:GITHUB_WORKSPACE 'bridge\src\bin\Debug\net9.0\unreal-mcp-bridge.exe'
          if (-not (Test-Path $bridge)) { throw "bridge binary not found at $bridge" }
          echo "UNREAL_MCP_BRIDGE_PATH=$bridge" >> $env:GITHUB_ENV

      - name: Resolve runner-local host project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $runnerLocalHost = Join-Path $runnerRoot 'host\UnrealTestProject\UnrealTestProject.uproject'
          if (Test-Path $runnerLocalHost) {
            "HOST_UPROJECT=$runnerLocalHost" >> $env:GITHUB_ENV
            Write-Host "Using runner-local host project: $runnerLocalHost"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path $env:HOST_UPROJECT)) {
            Write-Host "Using UNREAL_HOST_PROJECT fallback: $env:HOST_UPROJECT"
          } else {
            throw "No host .uproject found. Expected runner-local '$runnerLocalHost' or a valid UNREAL_HOST_PROJECT repo variable."
          }

      # Machine-wide UE serialization (#293) — see the plugin job. Taken after the chain feed and
      # bridge build (no UE there) so this job does not hold the machine while it clones and
      # packs; from here the BuildPlugin, the host junction and the fixed smoke port 18080 are
      # all machine-shared, so everything up to the release step stays inside the lock.
      - name: Acquire machine-wide UE lock
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\ue-machine-lock.ps1" -Action Acquire -WaitMinutes 120

      - name: BuildPlugin into the host junction target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set (see docs/RELEASING.md)."
          }
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          # This job runs in its OWN context — RUNNER_TEMP is cleaned per job, so the
          # plugin leg's package is gone. The host project's Plugins\UnrealMCP junctions
          # to $RUNNER_TEMP\UnrealMCP-Package (docs/RELEASING.md); BuildPlugin there so
          # the host editor loads THIS PR's plugin for the smoke. (PR BuildPlugin does
          # not bundle the §6 sidecar — that is why UNREAL_MCP_BRIDGE_PATH is set above.)
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed ($LASTEXITCODE)" }
          # SELF-HEAL the host's Plugins\UnrealMCP junction (docs/RELEASING.md invariant) —
          # same rationale as the plugin leg: force-recreate it to point at THIS run's
          # $package so off-workflow tooling that repointed it at the submodule source
          # can never wedge the smoke. Idempotent: drop any existing reparse point/dir
          # first, then mklink /J. $package was just populated above.
          $hostPluginsDir = Join-Path (Split-Path -Parent $env:HOST_UPROJECT) 'Plugins'
          $hostJunction = Join-Path $hostPluginsDir 'UnrealMCP'
          New-Item -ItemType Directory -Force -Path $hostPluginsDir | Out-Null
          if (Test-Path -LiteralPath $hostJunction) {
            cmd /c rmdir "$hostJunction" 2>$null
            if (Test-Path -LiteralPath $hostJunction) { Remove-Item -LiteralPath $hostJunction -Recurse -Force }
          }
          cmd /c mklink /J "$hostJunction" "$package" | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Failed to (re)create host junction $hostJunction -> $package (exit $LASTEXITCODE)" }
          $resolved = (Get-Item -LiteralPath $hostJunction).Target
          Write-Host "Host junction: $hostJunction -> $resolved (expected $package)"
          # Rebuild the host's own game module for THIS matrix engine so the smoke's
          # editor launch does not fail on out-of-date modules (the committed host
          # Binaries may be built for a different UE version; -unattended will not
          # interactively rebuild). The plugin is current via the junction above.
          # Force -NoLiveCoding for the same self-hosted service-account reason as
          # the Automation leg above.
          $hostBuild = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $hostTarget = [System.IO.Path]::GetFileNameWithoutExtension($env:HOST_UPROJECT) + 'Editor'
          $hostBuildLog = Join-Path $env:RUNNER_TEMP "UBT-$hostTarget-$($env:GITHUB_JOB)-$($env:RUNNER_NAME).log"
          & $hostBuild $hostTarget Win64 Development -project="$env:HOST_UPROJECT" -WaitMutex -NoLiveCoding -log="$hostBuildLog"
          if ($LASTEXITCODE -ne 0) { throw "Host editor target ($hostTarget) build failed for UE_ROOT=$env:UE_ROOT (exit $LASTEXITCODE)" }

      - name: Run connection + tool smoke (custom local server)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set — the smoke needs a host .uproject with the UnrealMCP plugin compiled (see docs/RELEASING.md)."
          }
          $editorCmd = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $py = Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          if (-not (Test-Path $py)) { throw "UE bundled Python not found at $py" }
          # --mode custom downloads the public gamedev-mcp-server release, runs it,
          # launches the editor in Custom mode, and asserts the tool battery. The
          # bridge override (UNREAL_MCP_BRIDGE_PATH, set above) is inherited by the
          # editor the script spawns.
          if ($env:CHAIN_ACTIVE -eq '1') {
            # Under a lock the script must reuse the chain-built server (it prefers an existing
            # UNREAL_MCP_SERVER_PATH over the release download) — name it and its marker here,
            # because the script itself logs only the file name.
            if ([string]::IsNullOrWhiteSpace($env:UNREAL_MCP_SERVER_PATH) -or -not (Test-Path -LiteralPath $env:UNREAL_MCP_SERVER_PATH)) {
              throw "chain: UNREAL_MCP_SERVER_PATH '$env:UNREAL_MCP_SERVER_PATH' is not an existing chain-built server"
            }
            Write-Host "chain: smoke server UNREAL_MCP_SERVER_PATH=$env:UNREAL_MCP_SERVER_PATH"
            Get-Content -LiteralPath (Join-Path (Split-Path -Parent $env:UNREAL_MCP_SERVER_PATH) 'chain-identity.json') | Write-Host
          }
          & $py scripts/connection_smoke.py --mode custom --project "$env:HOST_UPROJECT" --ue "$editorCmd" --server-port 18080 --timeout 240
          if ($LASTEXITCODE -ne 0) { throw "connection + tool smoke FAILED (exit $LASTEXITCODE)" }

      - name: chain pin drift
        if: always() && env.CHAIN_ACTIVE == '1'
        shell: pwsh
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_leg_checks.py pin-drift --job connection-smoke --edges nuget --edges server-binary

      # Identity proof + per-job leg record: the bridge assets file at ws AND
      # UNREAL_MCP_SERVER_PATH -> the packed exe whose chain-identity.json matches. Exit 3 on any
      # failed proof => RED even if the smoke passed.
      - name: chain leg record
        id: chain_record
        if: always()
        shell: pwsh
        run: ${{ env.CHAIN_PY }} .github/scripts/chain_feed.py record --node unreal-mcp --job connection-smoke --edges nuget --edges server-binary --engine unreal --engine-version ${{ matrix.ue }} --job-status ${{ job.status }} "--warn=${{ env.CHAIN_PIN_DRIFT }}" --out chain-leg.json

      - name: chain leg artifact
        if: always() && steps.chain_record.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json

      - name: Cleanup this job's build outputs (self-hosted disk hygiene)
        # See the plugin job's cleanup note. Removes ONLY this job's own regenerable
        # RUNNER_TEMP package + host transient logs; preserves the host
        # DDC / Intermediate / Binaries speed cache, the junction (self-heal above),
        # and Docker (unused here; daemon shared with other runners).
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Remove-Tree([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p) -or -not (Test-Path -LiteralPath $p)) { return }
            Write-Host "Removing $p"
            cmd /c rmdir /s /q "$p" 2>$null
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          # Chain leg: the python junction LINK first (plain rmdir, never recursive), then the
          # generated override files (only when they carry the chain's GENERATED marker — this
          # clean:false workspace would otherwise hand them to the next ordinary run), the feed,
          # the lower-layer clones and the leg record.
          $chainPy = Join-Path $env:RUNNER_TEMP 'chain-py'
          if (Test-Path -LiteralPath $chainPy) { cmd /c rmdir "$chainPy" 2>$null }
          foreach ($name in 'nuget.config', 'Directory.Build.targets') {
            $p = Join-Path $env:GITHUB_WORKSPACE $name
            if ((Test-Path -LiteralPath $p) -and ((Get-Content -LiteralPath $p -Raw) -match 'GENERATED by chain\.py')) {
              Write-Host "Removing generated $p"
              Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue
            }
          }
          Remove-Tree (Join-Path $env:GITHUB_WORKSPACE '.artifacts')
          Remove-Tree (Join-Path $env:RUNNER_TEMP 'chain')
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'chain-leg.json') -Force -ErrorAction SilentlyContinue
          foreach ($name in @('UnrealMCP-Package','UnrealMCP-Dist-Package','UnrealMCP-Source-Package','AutomationReport')) {
            Remove-Tree (Join-Path $env:RUNNER_TEMP $name)
          }
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'UBT-*.log' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path -LiteralPath $env:HOST_UPROJECT)) {
            $hostRoot = Split-Path -Parent $env:HOST_UPROJECT
            foreach ($sub in @('Saved\Logs','Saved\Crashes')) { Remove-Tree (Join-Path $hostRoot $sub) }
          }
          Write-Host "Per-run cleanup done (DDC / Intermediate / Binaries and Docker intentionally preserved)."

      # Last step, so the smoke's BuildPlugin, editor and port stay inside the machine-wide UE lock.
      - name: Release machine-wide UE lock
        if: always()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\ue-machine-lock.ps1" -Action Release
