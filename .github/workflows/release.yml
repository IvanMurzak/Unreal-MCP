#
# Release pipeline (Godot-MCP release.yml skeleton, adapted for the UE three-leg
# mono-repo — docs/ARCHITECTURE.md §9.4). Shape:
#   check-version (read VersionName, compute gate) -> test fan-out -> artifact
#   build -> GATED publish (tag + GitHub Release + npm).
#
# ── Signed self-bootstrapping sidecar BUNDLE (docs/ARCHITECTURE.md §6, #51, #139) ──
# The self-contained `unreal-mcp-bridge` is built + code-signed per RID, then
# STAGED INTO the plugin tree before BuildPlugin, so the packaged plugin ships
# the signed sidecar for all four RIDs and is self-bootstrapping out of the box
# (no .NET install, no first-run download). Job graph:
#   check-version ─┬─ bridge (test)            ─┐
#                  ├─ test-cli                  │
#                  ├─ plugin (BuildPlugin+Auto) │  (test gate)
#                  ├─ build-bridge-macos  ──────┤  signs+notarizes osx, builds linux
#                  ├─ build-bridge-windows ─────┤  Azure-signs win-x64
#                  └─ build-plugin-zip ◄────────┘  downloads the 4 signed RID
#                        dirs, stages them under the FAB-SURVIVING source folder
#                        UnrealMCP/Source/ThirdParty/UnrealMcpBridge/<rid>/ (#139/#187;
#                        Fab strips Binaries/), emits the dedicated SOURCE install asset
#                        unreal-mcp-plugin-source-<version>.zip, runs BuildPlugin -Rocket
#                        (RuntimeDependencies stage Source/ThirdParty/UnrealMcpBridge/ ->
#                        Binaries/ThirdParty/UnrealMcpBridge/<rid>/), zips the PACKAGED
#                        plugin with the latest supported UE as unreal-mcp-plugin-<version>.zip ->
#                        publish-release attaches both plugin zips + the 4 signed bridge zips.
# Signing is GRACEFULLY DEGRADING: every sign/notarize step is `if: env.X != ''`
# guarded, so a run with NO secrets produces UNSIGNED-but-green artifacts. The
# Unreal-MCP repo has no signing secrets yet (the owner mirrors the 9 from
# GameDev-MCP-Server out-of-band — see docs/RELEASING.md); this PR merges and
# runs green without them and begins signing the moment they exist.
# NOTE: artifacts pass between jobs, so a failed release MUST be FULL-rerun,
# never `gh run rerun --failed` (a partial rerun loses the bridge artifacts).
#
# ── Gating (read docs/RELEASING.md for the full contract) ──────────────────
# `UnrealMCP/UnrealMCP.uplugin` VersionName is the SINGLE source of truth for the
# release version (commands/bump-version.ps1 keeps the other four files in sync).
#
#   should_release = (no `v<version>` tag exists yet) AND (this push bumped the
#                     VersionName line)
#   dry_run        = workflow_dispatch was invoked with dry_run=true
#   run_tests      = should_release OR dry_run
#
# Outcomes:
#   * Plain merge to main that does NOT bump VersionName  -> should_release=false,
#     dry_run=false -> run_tests=false -> EVERY job skips. Merging a workflow-only
#     or feature PR is therefore a guaranteed no-op (no tests, no artifacts, no
#     publish) — this is what keeps THIS PR's own merge inert.
#   * workflow_dispatch with dry_run=true -> run_tests=true (rehearse tests +
#     artifact builds, uploaded for inspection) while the tag/Release/npm jobs
#     are HARD-SKIPPED. This is the only way this pipeline is exercised during
#     the ci-workflows task — nothing is ever published.
#   * Merge that bumps VersionName to a new (untagged) version -> should_release
#     =true, dry_run=false -> the real release fires (operator action).
#   * workflow_dispatch with dry_run=false on an untagged version -> real release
#     escape hatch (re-run a release when the bump already landed).
#
# SAFETY: publish jobs are gated on `should_release == 'true' && dry_run !=
# 'true'`. The npm publish uses OIDC Trusted Publishing (no NPM_TOKEN secret);
# until the owner configures a Trusted Publisher for `unreal-mcp-cli`, that step
# fails auth and nothing is published. The self-hosted plugin artifact leg is
# gated on UNREAL_RUNNER_READY exactly like test_pull_request.yml.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse the release (run tests + build artifacts) WITHOUT tagging, creating a GitHub Release, or publishing to npm."
        required: false
        default: true
        type: boolean

# Least-privilege default for the whole workflow; the publish jobs elevate
# their own permissions (contents: write for the Release, id-token: write for
# npm OIDC) in their job blocks.
permissions:
  contents: read

# Serialize release runs so the tag-existence check and the publish that follows
# cannot race two concurrent runs into a double publish (tag_exists TOCTOU).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Read the release version from the .uplugin and decide whether THIS event
  # should cut a release, only rehearse (dry-run), or do nothing.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
      version_changed: ${{ steps.version_changed.outputs.changed }}
      should_release: ${{ steps.gate.outputs.should_release }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      run_tests: ${{ steps.gate.outputs.run_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from .uplugin VersionName
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '"VersionName"[[:space:]]*:[[:space:]]*"[^"]+"' UnrealMCP/UnrealMCP.uplugin \
            | head -n1 | sed -E 's/.*"VersionName"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          if [ -z "${version}" ]; then
            echo "::error::Could not read VersionName from UnrealMCP/UnrealMCP.uplugin"
            exit 1
          fi
          # Strict semver gate: this value is interpolated into downstream pwsh
          # and npm run-scripts, so reject anything that is not a clean
          # MAJOR.MINOR.PATCH(+prerelease/build) before it can leak shell/JS.
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::VersionName '${version}' is not strict semver — refusing to release."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version} (tag v${version})"

      - name: Check if tag exists
        id: tag_exists
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The checkout above ran with fetch-tags: true, so local tags are
          # complete — no third-party action needed (avoids an unpinned tag ref).
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet."
          fi

      # Did THIS push bump the VersionName line? On push we diff before..after;
      # a plain feature/workflow merge that does not touch that line yields
      # changed=false (keeping the release inert). On workflow_dispatch there is
      # no push diff, so report changed=true and rely on tag_exists + dry_run.
      - name: Detect VersionName bump
        id: version_changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-push event (${EVENT_NAME}): bump check skipped (relying on tag_exists + dry_run)."
            exit 0
          fi
          # Fail CLOSED: without a usable 'before' SHA we cannot prove a bump
          # happened, so treat it as unchanged rather than firing a release.
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No usable 'before' SHA — cannot confirm a bump; treating as unchanged (fail closed)."
            exit 0
          fi
          # Compare the VersionName VALUE at the before/after SHAs (not merely
          # whether the line was touched) — a whitespace/comment-only edit to the
          # line must not count as a release-worthy bump.
          read_version() {
            git show "$1:UnrealMCP/UnrealMCP.uplugin" 2>/dev/null \
              | grep -oE '"VersionName"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | head -n1 | sed -E 's/.*"VersionName"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
          }
          # `|| true` keeps a read failure (unfetchable SHA, .uplugin absent at
          # that SHA, or no VersionName match) from tripping `set -e` via the
          # command substitution before the fail-closed branches below can run.
          before_version="$(read_version "${BEFORE_SHA}" || true)"
          after_version="$(read_version "${AFTER_SHA}" || true)"
          # Fail CLOSED when EITHER side is unreadable. An empty after_version is
          # the obvious "can't read the current version" case. An empty
          # before_version is subtler but just as dangerous: read_version can fail
          # on the BEFORE side when a force-push to main makes github.event.before
          # unfetchable, or the .uplugin did not yet exist at that SHA. Comparing
          # empty != non-empty would score that as a bump and fire a REAL tag +
          # Release with no deliberate version change. The legitimate "VersionName
          # first introduced" case is intentionally NOT auto-released here — cut it
          # via workflow_dispatch with dry_run=false (the documented escape hatch).
          if [ -z "${after_version}" ] || [ -z "${before_version}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Could not read VersionName at before=${BEFORE_SHA} / after=${AFTER_SHA} — treating as unchanged (fail closed)."
          elif [ "${before_version}" != "${after_version}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "VersionName changed: '${before_version}' -> '${after_version}'."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "VersionName unchanged ('${after_version}') in ${BEFORE_SHA}..${AFTER_SHA} — release is a no-op."
          fi

      - name: Compute gate
        id: gate
        env:
          TAG_EXISTS: ${{ steps.tag_exists.outputs.exists }}
          VERSION_CHANGED: ${{ steps.version_changed.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          # Use the typed `inputs` context (default-applied) rather than the raw
          # `github.event.inputs`, which is empty when the input is omitted via
          # API/gh and would otherwise fail OPEN (dry_run=false -> real publish).
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          dry_run=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Fail CLOSED: a manual dispatch is a dry-run UNLESS the input is
            # explicitly the string "false". A missing/garbled input can never
            # fire a real publish this way.
            dry_run=true
            if [ "${DRY_RUN_INPUT}" = "false" ]; then
              dry_run=false
            fi
          fi
          should_release=false
          if [ "${TAG_EXISTS}" = "false" ] && [ "${VERSION_CHANGED}" = "true" ]; then
            should_release=true
          fi
          run_tests=false
          if [ "${should_release}" = "true" ] || [ "${dry_run}" = "true" ]; then
            run_tests=true
          fi
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "run_tests=${run_tests}" >> "$GITHUB_OUTPUT"
          echo "Gate: tag_exists=${TAG_EXISTS} version_changed=${VERSION_CHANGED} dry_run=${dry_run} -> should_release=${should_release}, run_tests=${run_tests}"

  # ── TEST GATE (runs on a real release OR a dry-run rehearsal) ──────────────

  bridge:
    name: bridge build + xUnit (${{ matrix.os }})
    needs: [check-version]
    if: needs.check-version.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore bridge/Unreal-MCP-Bridge.sln
      - name: Build
        run: dotnet build bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-restore
      - name: Test
        run: dotnet test bridge/Unreal-MCP-Bridge.sln --configuration Debug --no-build --verbosity normal

  test-cli:
    needs: [check-version]
    if: needs.check-version.outputs.run_tests == 'true'
    uses: ./.github/workflows/test_cli.yml

  # Plugin Automation gate — self-hosted, never red-by-absence (same
  # UNREAL_RUNNER_READY gate as test_pull_request.yml). For a REAL release the
  # runner MUST be registered (UNREAL_RUNNER_READY=true) so this job runs;
  # otherwise it is skipped and the publish jobs below (which `need` it) are
  # skipped too — a safe default. For a dry-run the publish jobs are skipped
  # regardless. See docs/RELEASING.md.
  plugin:
    name: plugin BuildPlugin + Automation (UE ${{ matrix.ue }})
    needs: [check-version]
    if: needs.check-version.outputs.run_tests == 'true' && vars.UNREAL_RUNNER_READY == 'true'
    # Matrix covers the supported UE 5.5/5.6/5.7/5.8 set; the single self-hosted
    # runner (label `unreal-5-7`, legacy) executes the legs sequentially.
    # fail-fast:false so one engine's failure never cancels the others. Downstream
    # artifact / publish jobs that `needs: [plugin]` wait for ALL legs — so a
    # release is gated on the plugin passing Automation across the full supported
    # engine matrix.
    runs-on: [self-hosted, windows, unreal-5-7]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ue: ['5.5', '5.6', '5.7', '5.8']
    env:
      # Engine path is driven by the matrix (standard Epic install layout).
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      HOST_UPROJECT: ${{ vars.UNREAL_HOST_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false
      - name: BuildPlugin (marketplace packaging validation — DISTRIBUTED, test-free)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # C2 (#139): validates the DISTRIBUTED package — the committed UnrealMCP.uplugin
          # omits UnrealMcpEditorTests (Fab review flags shipped test modules), so this
          # BuildPlugin -Rocket proves the marketplace package builds green test-free. The
          # Automation pass below rebuilds WITH the test module into a separate junction target.
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $runUAT)) { throw "RunUAT.bat not found at $runUAT — set the UNREAL_ENGINE_PATH repo variable." }
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Dist-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "Distributed BuildPlugin failed with exit code $LASTEXITCODE" }
          $distUplugin = Join-Path $package 'UnrealMCP.uplugin'
          if (Test-Path $distUplugin) {
            $mods = (Get-Content $distUplugin -Raw | ConvertFrom-Json).Modules.Name
            # Defensive: a null $mods (unreadable/empty Modules array) makes the
            # `-contains` below silently $false and defeats the C2 guard — fail loud.
            if (-not $mods) { throw "Could not read Modules from distributed .uplugin at $distUplugin — refusing to pass the C2 guard blind." }
            if ($mods -contains 'UnrealMcpEditorTests') {
              throw "Distributed package SHIPS UnrealMcpEditorTests — Fab review would flag it (C2 regression)."
            }
          }
      - name: Resolve runner-local host project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $runnerLocalHost = Join-Path $runnerRoot 'host\UnrealTestProject\UnrealTestProject.uproject'
          if (Test-Path $runnerLocalHost) {
            "HOST_UPROJECT=$runnerLocalHost" >> $env:GITHUB_ENV
            Write-Host "Using runner-local host project: $runnerLocalHost"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path $env:HOST_UPROJECT)) {
            Write-Host "Using UNREAL_HOST_PROJECT fallback: $env:HOST_UPROJECT"
          } else {
            throw "No host .uproject found. Expected runner-local '$runnerLocalHost' or a valid UNREAL_HOST_PROJECT repo variable."
          }
      - name: Run Automation specs (UnrealMcp. filter — test module rebuilt in)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOST_UPROJECT)) {
            throw "UNREAL_HOST_PROJECT repo variable is not set — the Automation pass needs a host .uproject with the UnrealMCP plugin enabled (see docs/RELEASING.md)."
          }
          # C2 (#139): the host's Plugins\UnrealMCP junctions to $RUNNER_TEMP\UnrealMCP-Package
          # (docs/RELEASING.md). The distributed package is test-free, so transiently ADD the
          # UnrealMcpEditorTests module, BuildPlugin into that junction target so the specs are
          # present, run Automation, then ALWAYS revert in finally (toggle is idempotent).
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $toggle = Join-Path $env:GITHUB_WORKSPACE 'commands\test-module-uplugin.ps1'
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          & $toggle -Action Add
          try {
            $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
            if (Test-Path $package) { Remove-Item $package -Recurse -Force }
            & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
            if ($LASTEXITCODE -ne 0) { throw "Automation BuildPlugin (with test module) failed with exit code $LASTEXITCODE" }
            # SELF-HEAL the host's Plugins\UnrealMCP junction (docs/RELEASING.md invariant).
            # It MUST point at THIS run's BuildPlugin output ($package =
            # $RUNNER_TEMP\UnrealMCP-Package), which INCLUDES the UnrealMcpEditorTests
            # module just built above so the UnrealMcp.* Automation specs register.
            # Off-workflow dev tooling can silently repoint it at the Fab-clean submodule
            # source (whose distributed .uplugin omits the test module -> 0 specs ->
            # "index.json MISSING"); force-recreate it here so a clobbered junction
            # auto-recovers. Idempotent: drop any existing reparse point/dir, then mklink /J.
            $hostPluginsDir = Join-Path (Split-Path -Parent $env:HOST_UPROJECT) 'Plugins'
            $hostJunction = Join-Path $hostPluginsDir 'UnrealMCP'
            New-Item -ItemType Directory -Force -Path $hostPluginsDir | Out-Null
            if (Test-Path -LiteralPath $hostJunction) {
              cmd /c rmdir "$hostJunction" 2>$null
              if (Test-Path -LiteralPath $hostJunction) { Remove-Item -LiteralPath $hostJunction -Recurse -Force }
            }
            cmd /c mklink /J "$hostJunction" "$package" | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "Failed to (re)create host junction $hostJunction -> $package (exit $LASTEXITCODE)" }
            $resolved = (Get-Item -LiteralPath $hostJunction).Target
            Write-Host "Host junction: $hostJunction -> $resolved (expected $package)"
            # Rebuild the host's OWN game module for THIS matrix engine so the editor
            # opens without an out-of-date-modules failure (the host's committed
            # Binaries may be built for a different UE version, and an -unattended
            # editor will NOT interactively rebuild). The plugin is already current
            # via the BuildPlugin into the host's Plugins junction above. IMPORTANT:
            # force -NoLiveCoding on the self-hosted service runner — UE 5.8's UBT
            # can otherwise probe the global LiveCoding mutex and die with
            # UnauthorizedAccessException under the service account.
            $hostBuild = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
            $hostTarget = [System.IO.Path]::GetFileNameWithoutExtension($env:HOST_UPROJECT) + 'Editor'
            $hostBuildLog = Join-Path $env:RUNNER_TEMP "UBT-$hostTarget-$($env:GITHUB_JOB)-$($env:RUNNER_NAME).log"
            & $hostBuild $hostTarget Win64 Development -project="$env:HOST_UPROJECT" -WaitMutex -NoLiveCoding -log="$hostBuildLog"
            if ($LASTEXITCODE -ne 0) { throw "Host editor target ($hostTarget) build failed for UE_ROOT=$env:UE_ROOT (exit $LASTEXITCODE)" }
            $editorCmd = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
            $reportDir = Join-Path $env:RUNNER_TEMP 'AutomationReport'
            if (Test-Path $reportDir) { Remove-Item $reportDir -Recurse -Force }
            & $editorCmd "$env:HOST_UPROJECT" -nullrhi -nosplash -unattended `
              -ExecCmds="Automation RunTests UnrealMcp.; Quit" `
              -ReportExportPath="$reportDir" -log
            # The editor's exit code is unreliable for test verdicts (test.md
            # Suite 3); the parsed index.json below is authoritative. Clear the
            # exit code so pwsh's auto-appended `exit $LASTEXITCODE` does not red
            # the step on a nonzero editor exit unrelated to a test failure.
            $global:LASTEXITCODE = 0
            echo "REPORT_DIR=$reportDir" >> $env:GITHUB_ENV
          }
          finally {
            & $toggle -Action Remove
          }
      - name: Parse Automation report (index.json is authoritative)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $index = Join-Path $env:REPORT_DIR 'index.json'
          if (-not (Test-Path $index)) { throw "Automation index.json is MISSING at $index — treat as FAILURE." }
          $report = Get-Content $index -Raw | ConvertFrom-Json
          $failed = [int]$report.failed
          $succeeded = [int]$report.succeeded
          # UE counts specs that pass while emitting a warning under a SEPARATE
          # succeededWithWarnings field; fold it into the pass tally so a
          # clean-but-warned suite is not misread as the 0-specs case below.
          $succeededWithWarnings = [int]$report.succeededWithWarnings
          $passed = $succeeded + $succeededWithWarnings
          Write-Host "Automation results: succeeded=$succeeded succeededWithWarnings=$succeededWithWarnings failed=$failed"
          if ($failed -gt 0) { throw "$failed Automation test(s) failed." }
          if ($passed -lt 1) { throw "No Automation tests succeeded — expected at least one UnrealMcp. spec." }

      - name: Upload Automation report on failure
        # REPORT_DIR is exported only at the END of the Automation step; an
        # earlier failure (BuildPlugin, missing editor) leaves it unset, so guard
        # the upload to avoid a second confusing failure on an empty path.
        if: ${{ failure() && env.REPORT_DIR != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-report
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup this job's build outputs (self-hosted disk hygiene)
        # Self-hosted disk hygiene. This runner is SHARED with other repos' jobs and
        # its RUNNER_TEMP + the persistent runner-local host project are NOT auto-pruned
        # after a job, so per-run BuildPlugin packages and host logs accumulate across
        # runs (a contributor to disk-full spikes during heavy concurrent CI). Remove
        # ONLY THIS job's own regenerable outputs. Deliberately NOT touched:
        #   • host DerivedDataCache / Intermediate / Binaries — a persistent
        #     shared-for-speed cache; deleting it forces a full shader/host recompile
        #     every run (§ guardrail: never prune a cache other runs rely on for speed).
        #   • the host Plugins\UnrealMCP junction — owned by the self-heal step above.
        #   • Docker — these UE jobs use no containers, and the daemon is shared with
        #     the context-engine / ai-pipeline runners' ACTIVE jobs.
        # Best-effort: a cleanup failure must NEVER red an otherwise-green run.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Remove-Tree([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p) -or -not (Test-Path -LiteralPath $p)) { return }
            Write-Host "Removing $p"
            cmd /c rmdir /s /q "$p" 2>$null
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          # 1. This job's per-run BuildPlugin / report outputs under RUNNER_TEMP.
          foreach ($name in @('UnrealMCP-Package','UnrealMCP-Dist-Package','UnrealMCP-Source-Package','AutomationReport')) {
            Remove-Tree (Join-Path $env:RUNNER_TEMP $name)
          }
          # 2. This job's UBT logs under RUNNER_TEMP.
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'UBT-*.log' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # 3. Host project transient logs/crashes ONLY (unbounded growers; NOT the
          #    DDC / Intermediate / Binaries speed caches).
          if (-not [string]::IsNullOrWhiteSpace($env:HOST_UPROJECT) -and (Test-Path -LiteralPath $env:HOST_UPROJECT)) {
            $hostRoot = Split-Path -Parent $env:HOST_UPROJECT
            foreach ($sub in @('Saved\Logs','Saved\Crashes')) { Remove-Tree (Join-Path $hostRoot $sub) }
          }
          Write-Host "Per-run cleanup done (DDC / Intermediate / Binaries and Docker intentionally preserved)."

  # ── ARTIFACT BUILD — SIGNED BRIDGE BUNDLE (runs on a real release OR a
  #    dry-run rehearsal). The self-contained bridge is built + code-signed per
  #    RID here, then (T4) STAGED INTO the plugin tree before BuildPlugin so the
  #    packaged plugin ships the signed sidecar (docs/ARCHITECTURE.md §6 BUNDLE
  #    model, issue #51). Signing is GRACEFULLY DEGRADING: every sign/notarize
  #    step is guarded `if: env.X != ''`, so a run with NO secrets still produces
  #    UNSIGNED-but-green artifacts. The Unreal-MCP repo has no signing secrets
  #    yet — this pipeline merges and runs green without them; it begins signing
  #    the moment the owner mirrors the GameDev-MCP-Server secret set.
  #    Platform split: codesign/notarytool are macOS-only and Azure Trusted
  #    Signing (signtool) is Windows-only, so the osx/linux RIDs build on a Mac
  #    runner and win-x64 builds on a Windows runner. ──────────────────────────

  # macOS + Linux: osx-arm64, osx-x64 (codesign + notarize), linux-x64
  # (unsigned, cross-built on the mac runner). Uploads the RAW per-RID publish
  # dirs (NOT zips) as artifacts so build-plugin-zip can stage them into the
  # plugin tree.
  build-bridge-macos:
    name: build bridge (macos + linux, signed)
    needs: [check-version]
    if: needs.check-version.outputs.run_tests == 'true'
    runs-on: macos-latest
    # Job-level env so the signing/notarization guards (`if: env.X != ''`) can
    # read these. A step's own `env:` is NOT visible to that same step's `if:` —
    # the condition is evaluated before step env is applied — so the
    # graceful-degradation guards MUST resolve their values at job scope.
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Make publish script executable
        run: chmod +x ./bridge/publish.sh
      # --no-zip: sign the raw apphost BEFORE zipping. Cross-build linux-x64
      # here too (no native linux toolchain needed for a portable self-contained
      # apphost); it ships unsigned (no Linux code-signing standard — matches
      # GameDev-MCP-Server).
      - name: Build self-contained bridge (osx + linux, no zip)
        shell: bash
        run: cd bridge && ./publish.sh Release osx-arm64 osx-x64 linux-x64 --no-zip

      # Import the Developer ID Application certificate into a temporary
      # keychain. Guarded on ALL THREE mac signing secrets so a partial-secrets
      # dispatch skips the whole sign+notarize path cleanly rather than dying
      # under `set -e` and taking the unsigned-upload fallback down with it.
      - name: Import macOS signing certificate
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Code-sign each osx apphost with the hardened runtime + the bridge
      # entitlements (allow-jit + disable-library-validation — the .NET
      # single-file host JITs and loads runtime-extracted native libs). Signing
      # ONLY the apphost suffices for the shipped single-file form;
      # disable-library-validation is what makes the runtime-extracted libs
      # legal at exec time. Same all-three-secrets guard as the import step.
      - name: Code-sign macOS bridge (hardened runtime)
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' }}
        run: |
          set -euo pipefail
          ENTITLEMENTS="build/entitlements.mac.plist"
          for rid in osx-arm64 osx-x64; do
            BIN="bridge/publish/${rid}/unreal-mcp-bridge"
            echo "Signing ${BIN}..."
            codesign --force --options runtime --timestamp \
              --entitlements "$ENTITLEMENTS" \
              --sign "$MAC_SIGN_IDENTITY" "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
          done

      # Notarize the two macOS apphosts. notarytool submits a ZIP, so zip each
      # signed osx dir to a throwaway notarization zip, submit, and require
      # status == "Accepted" (notarytool exits 0 even on Invalid/Rejected — the
      # exit code alone is NOT proof). The artifact we upload is the signed
      # publish DIR (not this zip) — the staged-into-plugin form is the binary,
      # not a zip. Notarization registers the binary's hash with Apple, so the
      # signed-and-notarized apphost passes Gatekeeper's first-exec check when
      # the editor spawns it (belt-and-suspenders with the T2 quarantine-xattr
      # strip for the offline case). Guarded on the signing secrets PLUS the
      # notarize API key — notarizing an unsigned binary is meaningless.
      - name: Notarize macOS bridge
        if: ${{ env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.MAC_SIGN_IDENTITY != '' && env.APPLE_API_KEY_B64 != '' }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"

          for rid in osx-arm64 osx-x64; do
            NOTARIZE_ZIP="$RUNNER_TEMP/unreal-mcp-bridge-${rid}-notarize.zip"
            (cd "bridge/publish/${rid}" && zip -r "$NOTARIZE_ZIP" .)
            echo "Notarizing ${rid}..."
            SUBMIT_JSON="$(xcrun notarytool submit "$NOTARIZE_ZIP" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json)"
            echo "$SUBMIT_JSON"
            STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::Notarization for ${rid} did not succeed (status: ${STATUS:-unknown})"
              exit 1
            fi
            echo "Notarization for ${rid} accepted."
            rm -f "$NOTARIZE_ZIP"
          done

          rm -f "$KEY_PATH"

      # Upload the RAW signed per-RID publish dirs (staging input for the plugin
      # zip job) AND the per-RID release zips (kept as debugging /
      # UNREAL_MCP_BRIDGE_PATH artifacts on the GitHub Release).
      - name: Zip signed bridge dirs (release artifacts)
        shell: bash
        run: |
          set -euo pipefail
          cd bridge/publish
          for rid in osx-arm64 osx-x64 linux-x64; do
            if [ -d "$rid" ]; then
              echo "Zipping ${rid}..."
              (cd "$rid" && zip -r "../unreal-mcp-bridge-${rid}.zip" .)
            else
              echo "::error::Expected publish dir ${rid} not found"
              exit 1
            fi
          done
          ls -la *.zip
      - name: Upload signed bridge staging dirs (osx + linux)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-staging-osx-linux
          path: |
            ./bridge/publish/osx-arm64/
            ./bridge/publish/osx-x64/
            ./bridge/publish/linux-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bridge release zips (osx + linux)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-zips-osx-linux
          path: ./bridge/publish/*.zip
          if-no-files-found: error
          retention-days: 7

  # Windows: win-x64, signed via Azure Trusted Signing (signtool is
  # Windows-only). Built on windows-latest. Uploads the raw signed publish dir
  # (staging input) AND the release zip.
  build-bridge-windows:
    name: build bridge (windows, signed)
    needs: [check-version]
    if: needs.check-version.outputs.run_tests == 'true'
    runs-on: windows-latest
    # Job-level env so the Azure Trusted Signing guard (`if: env.AZURE_CLIENT_ID
    # != ''`) can read it — a step's own `env:` is not visible to that step's own
    # `if:`. See the macOS job's env comment for the rationale.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      # -NoZip: sign the raw .exe BEFORE zipping.
      - name: Build self-contained bridge (win-x64, no zip)
        shell: pwsh
        run: ./bridge/publish.ps1 -Configuration Release -Platforms win-x64 -NoZip

      # Sign the win-x64 .exe via Azure Artifact Signing (formerly Trusted
      # Signing). Guarded: skipped when AZURE_CLIENT_ID is empty, leaving the
      # .exe unsigned but still stageable.
      - name: Sign Windows bridge (Azure Artifact Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: ivan-murzak
          certificate-profile-name: ai-game-dev-cert
          files-folder: ${{ github.workspace }}/bridge/publish/win-x64
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Zip signed bridge dir (release artifact)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishRoot = Join-Path $PWD "bridge/publish"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $rid = "win-x64"
          $runtimePath = Join-Path $publishRoot $rid
          if (-not (Test-Path $runtimePath)) { Write-Error "Expected publish dir $rid not found" }
          $zipPath = Join-Path $publishRoot "unreal-mcp-bridge-$rid.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($runtimePath, $zipPath)
          Get-ChildItem -Path $publishRoot -Filter "*.zip" | Select-Object Name, Length
      - name: Upload signed bridge staging dir (win)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-staging-win
          path: ./bridge/publish/win-x64/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bridge release zip (win)
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-zips-win
          path: ./bridge/publish/*.zip
          if-no-files-found: error
          retention-days: 7

  # NOTE: there is no server artifact job — the MCP server lives in its own
  # shared repo (IvanMurzak/GameDev-MCP-Server, assets gamedev-mcp-server-
  # <rid>.zip) and is released there; the CLI downloads the release pinned by
  # cli/src/lib/server-version.ts SERVER_VERSION.

  # Release plugin zips: the dedicated SOURCE install asset
  # `unreal-mcp-plugin-source-<version>.zip` (CLI/Fab install path, no
  # EngineVersion pin, test-free descriptor) AND the PACKAGED BuildPlugin asset
  # `unreal-mcp-plugin-<version>.zip` with the signed bridge bundled in under
  # Binaries/ThirdParty/. The single packaged artifact is built with the latest
  # supported UE; the source artifact stays engine-version unpinned and the
  # release matrix still validates the lower supported engines. Self-hosted,
  # gated like the plugin test job. Skipped when no runner is registered; for a
  # real release the runner must be ready (publish-release `needs` this job).
  # Depends on the plugin matrix so its UE 5.8 BuildPlugin cannot overlap the UE
  # 5.8 validation leg on the same machine's AutomationTool lock. Also depends
  # on the two signed-bridge jobs so the 4 signed RID payloads can be staged into
  # the plugin tree before the source asset is cut and BuildPlugin packages them
  # (docs/ARCHITECTURE.md §6 BUNDLE model, T4).
  build-plugin-zip:
    name: build plugin release zips (UE 5.8)
    needs: [check-version, plugin, build-bridge-macos, build-bridge-windows]
    if: needs.check-version.outputs.run_tests == 'true' && vars.UNREAL_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unreal-5-7]
    env:
      UE_ROOT: ${{ vars.UNREAL_ENGINE_PATH || 'C:\Program Files\Epic Games\UE_5.8' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Self-hosted runner persists between jobs; don't leave this job's
          # GITHUB_TOKEN in the worktree's .git config after checkout.
          persist-credentials: false
      # Download the signed per-RID publish dirs produced by the two
      # build-bridge-* jobs, merging all four RIDs under ./bridge-staging/<rid>/.
      # The two artifacts were rooted differently by upload-artifact:
      #   * bridge-staging-osx-linux was uploaded with THREE dir paths
      #     (osx-arm64/, osx-x64/, linux-x64/), so the artifact is rooted at
      #     their least-common-ancestor (bridge/publish/) and PRESERVES the
      #     top-level <rid>/ folders — extracting it to ./bridge-staging yields
      #     ./bridge-staging/<rid>/ directly.
      #   * bridge-staging-win was uploaded with a SINGLE dir path
      #     (./bridge/publish/win-x64/), so the artifact is rooted AT that dir
      #     and its contents are the win-x64 files WITHOUT the win-x64/ segment.
      #     Extract it into ./bridge-staging/win-x64 so the segment is restored
      #     and the staging loop below finds ./bridge-staging/win-x64/.
      - name: Download signed bridge (osx + linux)
        uses: actions/download-artifact@v8
        with:
          name: bridge-staging-osx-linux
          path: ./bridge-staging
      - name: Download signed bridge (win)
        uses: actions/download-artifact@v8
        with:
          name: bridge-staging-win
          path: ./bridge-staging/win-x64
      # Stage the signed binaries into the FAB-SURVIVING source folder the C++
      # resolver (FUnrealMcpSidecarManager::ComposeSurvivingBridgePath) and the
      # Build.cs RuntimeDependencies SOURCE arg both read (#139/#187):
      #   UnrealMCP/Source/ThirdParty/UnrealMcpBridge/<rid>/
      # This engine-canonical Source/ThirdParty/ folder survives a Fab strip
      # (Binaries/ is stripped) and is declared in Config/FilterPlugin.ini;
      # UnrealMcpRuntime.Build.cs's RuntimeDependencies two-arg (target,source) form
      # then STAGES it into the package's Binaries/ThirdParty/UnrealMcpBridge/<rid>/ at
      # BuildPlugin time. The payload files are gitignored — they exist only
      # transiently on the runner. If a future UBT does not stage them (design R6), the
      # post-BuildPlugin copy below populates the package's Binaries/ThirdParty path as a fallback.
      - name: Stage signed bridge into the Fab-surviving Source/ThirdParty folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:GITHUB_WORKSPACE 'bridge-staging'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\Source\ThirdParty\UnrealMcpBridge'
          $rids = @('win-x64', 'osx-arm64', 'osx-x64', 'linux-x64')
          foreach ($rid in $rids) {
            $src = Join-Path $staging $rid
            if (-not (Test-Path $src)) { throw "Staged bridge dir missing for RID '$rid' at $src" }
            $ridDest = Join-Path $dest $rid
            if (Test-Path $ridDest) { Remove-Item $ridDest -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $ridDest | Out-Null
            Copy-Item -Path (Join-Path $src '*') -Destination $ridDest -Recurse -Force
            $files = Get-ChildItem -Path $ridDest -Recurse -File
            Write-Host "Staged $($files.Count) file(s) for $rid -> $ridDest"
            if ($files.Count -lt 1) { throw "No files staged for RID '$rid'." }
          }
      - name: Build source plugin zip
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP'
          $uplugin = Join-Path $pluginRoot 'UnrealMCP.uplugin'
          $descriptor = Get-Content $uplugin -Raw | ConvertFrom-Json
          $hasEngineVersion = ($descriptor.PSObject.Properties.Name -contains 'EngineVersion') -and -not [string]::IsNullOrWhiteSpace([string]$descriptor.EngineVersion)
          if ($hasEngineVersion) {
            throw "The distributed source descriptor must not pin EngineVersion (found '$($descriptor.EngineVersion)')."
          }
          $modules = @($descriptor.Modules.Name)
          if ($modules -contains 'UnrealMcpEditorTests') {
            throw "The distributed source descriptor must not ship UnrealMcpEditorTests."
          }
          $stageRoot = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Source-Package'
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          $pluginStage = Join-Path $stageRoot 'UnrealMCP'
          New-Item -ItemType Directory -Force -Path $pluginStage | Out-Null
          foreach ($rel in @(
            'UnrealMCP.uplugin',
            'Config',
            'Resources',
            'Source\UnrealMcpRuntime',
            'Source\UnrealMcpEditor',
            'Source\ThirdParty',
            'ThirdPartyNotices.txt'
          )) {
            $src = Join-Path $pluginRoot $rel
            if (-not (Test-Path $src)) { throw "Source-asset input missing: $src" }
            $dst = Join-Path $pluginStage $rel
            $dstParent = Split-Path -Parent $dst
            if (-not [string]::IsNullOrWhiteSpace($dstParent)) {
              New-Item -ItemType Directory -Force -Path $dstParent | Out-Null
            }
            if (Test-Path $src -PathType Container) {
              Copy-Item -Path $src -Destination $dst -Recurse -Force
            } else {
              Copy-Item -Path $src -Destination $dst -Force
            }
          }
          if (Test-Path (Join-Path $pluginStage 'Source\UnrealMcpEditorTests')) {
            throw "The source asset staging unexpectedly included UnrealMcpEditorTests."
          }
          foreach ($rid in @('win-x64', 'osx-arm64', 'osx-x64', 'linux-x64')) {
            $ridDir = Join-Path $pluginStage "Source\ThirdParty\UnrealMcpBridge\$rid"
            $fileCount = @(Get-ChildItem -Path $ridDir -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "Source asset bridge for ${rid}: $fileCount file(s)."
            if ($fileCount -lt 1) { throw "Source asset is missing the staged bridge payload for RID '$rid'." }
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = Join-Path $out "unreal-mcp-plugin-source-$env:PLUGIN_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $pluginStage -DestinationPath $zip -Force
      - name: BuildPlugin + zip
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runUAT = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $runUAT)) { throw "RunUAT.bat not found at $runUAT — set the UNREAL_ENGINE_PATH repo variable." }
          $uplugin = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\UnrealMCP.uplugin'
          $package = Join-Path $env:RUNNER_TEMP 'UnrealMCP-Package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          & $runUAT BuildPlugin -Plugin="$uplugin" -Package="$package" -TargetPlatforms=Win64 -Rocket
          if ($LASTEXITCODE -ne 0) { throw "BuildPlugin failed with exit code $LASTEXITCODE" }
          # Verify the signed bridge bundle landed in the packaged plugin via
          # RuntimeDependencies (#139/#187: source = UnrealMCP/Source/ThirdParty/UnrealMcpBridge/<rid>/,
          # target = the package's Binaries/ThirdParty/UnrealMcpBridge/<rid>/). If UBT did
          # not stage the payloads (design R6), copy them from the surviving
          # Source/ThirdParty/UnrealMcpBridge source into the package's Binaries/ThirdParty
          # path (the resolver's staged path) as a fallback so the shipped zip always carries them.
          $pkgThirdParty = Join-Path $package 'Binaries\ThirdParty\UnrealMcpBridge'
          $srcSidecar = Join-Path $env:GITHUB_WORKSPACE 'UnrealMCP\Source\ThirdParty\UnrealMcpBridge'
          foreach ($rid in @('win-x64', 'osx-arm64', 'osx-x64', 'linux-x64')) {
            $pkgRid = Join-Path $pkgThirdParty $rid
            if (-not (Test-Path $pkgRid) -or @(Get-ChildItem -Path $pkgRid -Recurse -File -ErrorAction SilentlyContinue).Count -lt 1) {
              Write-Host "RuntimeDependencies did not stage $rid into the package — applying post-step copy from Source/ThirdParty/UnrealMcpBridge/ (design R6 fallback)."
              New-Item -ItemType Directory -Force -Path $pkgRid | Out-Null
              Copy-Item -Path (Join-Path (Join-Path $srcSidecar $rid) '*') -Destination $pkgRid -Recurse -Force
            }
            $n = @(Get-ChildItem -Path $pkgRid -Recurse -File).Count
            Write-Host "Packaged bridge for ${rid}: $n file(s)."
            if ($n -lt 1) { throw "Packaged plugin is missing the bundled bridge for RID '$rid'." }
          }
          # Also confirm the Fab-surviving source folder shipped INSIDE the package
          # (the form Epic's recompile stages from). Fab strips Binaries/, so the
          # Source/ThirdParty/UnrealMcpBridge/<rid>/ copy is what survives a source submission.
          $pkgSidecar = Join-Path $package 'Source\ThirdParty\UnrealMcpBridge'
          foreach ($rid in @('win-x64', 'osx-arm64', 'osx-x64', 'linux-x64')) {
            $pkgRid = Join-Path $pkgSidecar $rid
            $n = @(Get-ChildItem -Path $pkgRid -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "Packaged Fab-surviving Source/ThirdParty/UnrealMcpBridge for ${rid}: $n file(s)."
            if ($n -lt 1) { throw "Packaged plugin is missing the Fab-surviving Source/ThirdParty/UnrealMcpBridge/$rid payload (FilterPlugin.ini)." }
          }
          $version = $env:PLUGIN_VERSION
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $out "unreal-mcp-plugin-$version.zip") -Force
      - name: Upload source plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-source-zip
          path: ./dist/unreal-mcp-plugin-source-${{ needs.check-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload packaged plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: unreal-mcp-plugin-packaged-zip
          path: ./dist/unreal-mcp-plugin-${{ needs.check-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup this job's build outputs (self-hosted disk hygiene)
        # Self-hosted disk hygiene. The release packaging outputs are the LARGEST
        # per-run artifacts on this shared runner (compiled BuildPlugin package +
        # staged source package). RUNNER_TEMP is not auto-pruned after a job, so
        # remove ONLY THIS job's own regenerable outputs here (the uploaded artifacts
        # are already safely stored). This job builds no host project and touches no
        # Docker, so neither the host DDC/Intermediate/Binaries speed cache nor the
        # shared Docker daemon is relevant. Best-effort: never red a green run.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Remove-Tree([string]$p) {
            if ([string]::IsNullOrWhiteSpace($p) -or -not (Test-Path -LiteralPath $p)) { return }
            Write-Host "Removing $p"
            cmd /c rmdir /s /q "$p" 2>$null
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          foreach ($name in @('UnrealMCP-Package','UnrealMCP-Source-Package')) {
            Remove-Tree (Join-Path $env:RUNNER_TEMP $name)
          }
          Write-Host "Per-run release-packaging cleanup done."

  # ── PUBLISH (gated on a REAL release: tag absent + version bumped, NOT a
  #    dry-run). Every job here is hard-skipped during the ci-workflows dry-run. ─

  # Create the GitHub Release + `v<version>` tag with the bridge zips, the
  # dedicated SOURCE install asset, and the PACKAGED BuildPlugin zip attached.
  # (Server zips are released from the shared GameDev-MCP-Server repo, not here.)
  publish-release:
    name: publish GitHub Release
    needs:
      [
        check-version,
        bridge,
        test-cli,
        plugin,
        build-bridge-macos,
        build-bridge-windows,
        build-plugin-zip,
      ]
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.mark.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Attach both plugin artifacts:
      #   * unreal-mcp-plugin-source-<version>.zip  -> CLI/Fab source install asset
      #   * unreal-mcp-plugin-<version>.zip         -> packaged BuildPlugin artifact
      # The per-RID signed bridge zips are also attached for debugging /
      # UNREAL_MCP_BRIDGE_PATH users.
      - name: Download bridge release zips (osx + linux)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-osx-linux
          path: ./assets
      - name: Download bridge release zip (win)
        uses: actions/download-artifact@v8
        with:
          name: bridge-release-zips-win
          path: ./assets
      - name: Download source plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-source-zip
          path: ./assets
      - name: Download packaged plugin zip
        uses: actions/download-artifact@v8
        with:
          name: unreal-mcp-plugin-packaged-zip
          path: ./assets
      - name: List assembled release assets
        run: ls -la ./assets
      # Sign the plugin-SOURCE zip with the pinned publisher key so the CLI can
      # VERIFY it before install (zero-config-engine-connect D12). A same-origin
      # SHA256 is integrity-only (a release-asset attacker swaps the zip AND its
      # checksum); a detached minisign (Ed25519) signature over an OFFLINE key is a
      # real supply-chain control. The CLI's `plugin-signature.ts` verifies this
      # `.minisig` against the baked-in `MINISIGN_PUBLIC_KEY`. FAIL-CLOSED: a real
      # release MUST be signed, so this step errors when `MINISIGN_SECRET_KEY` is
      # absent rather than publishing a source zip the CLI would then reject.
      # ⚠ Provisioning is a follow-up (see docs/RELEASING.md "Plugin-source signing
      # key"): mint a PASSWORDLESS keypair (`minisign -G -W`), add the secret-key
      # file as the repo secret `MINISIGN_SECRET_KEY`, and bake the public key into
      # `cli/src/lib/plugin-signature.ts`. Until then this step fails the release.
      - name: Sign the plugin-source zip (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set. The plugin-source signing key must be provisioned before a release (docs/RELEASING.md 'Plugin-source signing key'). Refusing to publish an unsigned source zip the CLI would reject (fail-closed)."
            exit 1
          fi
          zip="./assets/unreal-mcp-plugin-source-${VERSION}.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::Source zip not found at $zip"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          keyfile="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # The key is passwordless (minted with `minisign -G -W`), so signing does
          # not prompt; `< /dev/null` guards against any interactive read on a CI
          # runner with no tty. `-x` names the detached signature output.
          minisign -S -s "$keyfile" -m "$zip" -x "${zip}.minisig" \
            -t "unreal-mcp plugin source ${VERSION} signed by AI Game Dev release CI" < /dev/null
          rm -f "$keyfile"
          echo "Signed $zip -> ${zip}.minisig"
          ls -la ./assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Attach every zip AND the plugin-source `.minisig` signature (D12).
          files=(./assets/*.zip ./assets/*.minisig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release zip assets found in ./assets"
            exit 1
          fi
          gh release create "${TAG}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
      - name: Mark publish success
        id: mark
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  # Publish unreal-mcp-cli to npm via OIDC Trusted Publishing (no NPM_TOKEN secret).
  # Gated on the GitHub Release having been created (i.e. a real, non-dry-run
  # release). The cli version is aligned to the release version at publish time.
  publish-npm:
    name: publish unreal-mcp-cli to npm
    needs: [check-version, publish-release]
    if: needs.publish-release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing — no NPM_TOKEN needed.
    defaults:
      run:
        working-directory: ./cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # npm OIDC Trusted Publishing requires npm >= 11.5.1; the bundled npm is
      # older and would fail the token exchange with a masked E404.
      - name: Upgrade npm (OIDC Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@11
      - name: Align package version to the release version
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # NOTE: cli/package.json is `private: true` until the publish gate opens
      # (conventions.md). The owner removes that flag in the version-bump commit
      # that cuts the first real release; this step publishes the public package.
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
