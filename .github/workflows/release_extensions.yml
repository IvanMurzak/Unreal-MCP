name: release-extension

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin folder under extensions/ (versions are read from source)
        required: true
        type: string
      dry_run:
        description: Test and package without publishing
        default: true
        type: boolean
      bootstrap_index:
        description: Explicitly initialize the download index on the first publication only
        default: false
        type: boolean

# Serialize ALL component publication and index read/modify/write, including different tags.
concurrency:
  group: unreal-extension-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.validate.outputs.plugin }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate component and publication branch
        id: validate
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import extension_release as release
          plugin = os.environ['PLUGIN']
          if plugin not in release.components():
              raise SystemExit('Unknown extension')
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Release workflow must run on main')
          release.validate(plugin)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'plugin={plugin}\n')
          PY
      - name: Test release and suite tooling
        run: python3 -m unittest discover -s scripts -p 'test_extension*.py'

  test:
    needs: validate
    # Required, no readiness skip: a release cannot pass without its engine checks.
    strategy:
      fail-fast: false
      matrix:
        ue: ['5.7', '5.8']
    runs-on:
      - self-hosted
      - windows
      - rm-autoscale-win-x64
      - ${{ fromJSON('{"5.7":"unreal-5-7","5.8":"unreal-5-8"}')[matrix.ue] }}
    timeout-minutes: 180
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_${{ matrix.ue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build CLI for live E2E
        working-directory: cli
        run: npm ci && npm run build
      - name: Acquire machine-wide UE lock
        shell: pwsh
        run: ./.github/scripts/ue-machine-lock.ps1 -Action Acquire
      - name: Isolated builds and all Automation/E2E checks in one editor
        shell: pwsh
        run: |
          $python = Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          & $python scripts/extension_suite.py --engine $env:UE_ROOT --mode full --result-file .artifacts/suite-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Full extension suite failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: extension-suite-${{ matrix.ue }}
          path: .artifacts/suite-result.json
          if-no-files-found: error
      - name: Release machine-wide UE lock
        if: always()
        shell: pwsh
        run: ./.github/scripts/ue-machine-lock.ps1 -Action Release

  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN: ${{ needs.validate.outputs.plugin }}
      DRY_RUN: ${{ inputs.dry_run }}
      BOOTSTRAP: ${{ inputs.bootstrap_index }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package only the selected extension; publish after all gates pass
        run: |
          python3 - <<'PY'
          import os, subprocess
          action = 'package' if os.environ['DRY_RUN'] == 'true' else 'publish'
          args = ['python3', 'scripts/extension_release.py', action, '--plugin', os.environ['PLUGIN']]
          if os.environ['BOOTSTRAP'] == 'true':
              args.append('--bootstrap-index')
          subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: .artifacts/releases/*.zip
          if-no-files-found: error
