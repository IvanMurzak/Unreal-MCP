<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="An AI agent talks MCP to the server (ai-game.dev cloud or a local gamedev-mcp-server); the server relays over SignalR to the unreal-mcp-bridge .NET sidecar, which reaches the UnrealMCP C++ plugin in the Unreal Editor over loopback TCP. Built-in tool groups: RQL data layer, Blueprint, C++ source, Screenshot, Fab, Console, Python, Tool list.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="480" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#hzR)"/><rect width="1200" height="480" fill="url(#hzB)"/>
    <rect width="1200" height="480" fill="url(#dots)"/>
    <text x="40" y="72" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">HOW IT WORKS</text><rect x="40" y="104" width="220" height="130" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="116" width="3" height="106" rx="1.5" fill="#6FA8D0"/><text x="62" y="165.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Your AI agent</text><text x="62" y="191.0" class="s" font-size="16" fill="#8AA6B8">Claude Code, Cursor,</text><text x="62" y="213.0" class="s" font-size="16" fill="#8AA6B8">Copilot, Codex, …</text><rect x="340" y="104" width="220" height="130" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="340" y="116" width="3" height="106" rx="1.5" fill="#6FA8D0"/><text x="362" y="165.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">MCP server</text><text x="362" y="191.0" class="s" font-size="16" fill="#8AA6B8">ai-game.dev cloud or</text><text x="362" y="213.0" class="s" font-size="16" fill="#8AA6B8">gamedev-mcp-server</text><rect x="640" y="104" width="220" height="130" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="640" y="116" width="3" height="106" rx="1.5" fill="#EAB308"/><text x="662" y="165.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Sidecar</text><text x="662" y="191.0" class="s" font-size="16" fill="#8AA6B8">unreal-mcp-bridge</text><text x="662" y="213.0" class="s" font-size="16" fill="#8AA6B8">.NET 9, auto-started</text><rect x="940" y="104" width="220" height="130" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="940" y="116" width="3" height="106" rx="1.5" fill="#FF5A73"/><text x="962" y="165.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">UnrealMCP plugin</text><text x="962" y="191.0" class="s" font-size="16" fill="#8AA6B8">C++, inside the editor</text><text x="962" y="213.0" class="s" font-size="16" fill="#8AA6B8">tools on game thread</text><text x="300.0" y="148" text-anchor="middle" class="s" font-size="16" font-weight="700" fill="#A8C2D2">MCP</text><path id="w1" d="M266 166 L334 166" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M266 186 L334 186" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w2"/></animateMotion></circle><text x="600.0" y="148" text-anchor="middle" class="s" font-size="16" font-weight="700" fill="#A8C2D2">SignalR</text><path id="w3" d="M566 166 L634 166" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M566 186 L634 186" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w4"/></animateMotion></circle><text x="900.0" y="148" text-anchor="middle" class="s" font-size="16" font-weight="700" fill="#A8C2D2">TCP</text><path id="w5" d="M866 166 L934 166" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-1.0s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><path id="w6" d="M866 186 L934 186" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w6"/></animateMotion></circle><text x="40" y="296" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">BUILT-IN TOOL GROUPS</text><g transform="translate(40 316)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">RQL data layer</text></g><g transform="translate(324 316)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Blueprint</text></g><g transform="translate(608 316)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">C++ source</text></g><g transform="translate(892 316)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Screenshot</text></g><g transform="translate(40 364)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Fab</text></g><g transform="translate(324 364)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Console</text></g><g transform="translate(608 364)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Python</text></g><g transform="translate(892 364)"><rect width="268" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="134.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Tool list</text></g><text x="600.0" y="446" text-anchor="middle" class="s" font-size="16" fill="#8AA6B8">Loopback only: the plugin listens, the sidecar dials in with a one-shot token.</text>
    <rect x="0" y="478" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="479" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
